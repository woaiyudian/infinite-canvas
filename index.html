<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pavo分镜画布-右键菜单+框选版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{overflow:hidden;background:#0a0b10;color:#fff;height:100vh;height:100dvh;overscroll-behavior:none}
#cv{display:block;cursor:crosshair;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.top-bar{position:fixed;top:0;left:0;right:0;height:48px;background:#14161f;border-bottom:1px solid #252a3d;display:flex;align-items:center;padding:0 16px;gap:10px;z-index:20;overflow-x:auto}
.top-bar .proj-item{display:flex;align-items:center;gap:6px;padding:6px 12px;background:#1c2030;border-radius:8px;cursor:pointer;font-size:13px;white-space:nowrap}
.top-bar .proj-item.active{background:#7c3aed}
.top-bar .del-proj{color:#ef4444;cursor:pointer;font-size:14px;user-select:none}
.toolbar{position:fixed;left:12px;top:64px;display:flex;flex-direction:column;gap:8px;background:#1c2030;padding:10px;border-radius:12px;border:1px solid #2d3348;z-index:10}
.tool-btn{width:40px;height:40px;border:none;background:#2d3348;color:#fff;border-radius:8px;font-size:18px;cursor:pointer}
.tool-btn:hover{background:#3d4358}
.zoom-bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:#1c2030;padding:6px 12px;border-radius:20px;border:1px solid #2d3348;z-index:10}
.zoom-bar button{width:28px;height:28px;border:none;background:#2d3348;color:#fff;border-radius:6px;cursor:pointer}
#zoomLabel{font-size:13px;min-width:40px;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:none;align-items:center;justify-content:center;z-index:100}
.modal-content{background:#1c2030;padding:24px;border-radius:12px;width:460px;border:1px solid #2d3348;max-height:calc(100dvh - 24px);overflow-y:auto}
.modal-content h3{margin-bottom:16px;font-size:16px}
.form-row{display:flex;gap:10px;margin:10px 0;align-items:center}
.form-row label{font-size:13px;width:80px;flex-shrink:0}
.modal-content input,.modal-content textarea,.modal-content select{flex:1;padding:8px;border-radius:6px;border:1px solid #2d3348;background:#0a0b10;color:#fff;font-size:13px}
.modal-content textarea{min-height:80px;resize:vertical}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.btn-primary{background:#7c3aed;color:#fff;padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:13px}
.btn-secondary{background:#2d3348;color:#fff;padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:13px}
.edit-modal{position:fixed;z-index:120;background:#1c2030;padding:20px;border-radius:12px;border:1px solid #444;display:none;width:400px}
.edit-modal label{display:block;margin:8px 0 4px}
.edit-modal input,.edit-modal textarea{width:100%;padding:8px;border-radius:6px;border:1px solid #2d3348;background:#0a0b10;color:#fff;font-size:13px}
.edit-modal textarea{min-height:100px;resize:vertical}
.ctx-menu{position:fixed;z-index:200;min-width:212px;background:#191d2b;border:1px solid #2f3550;border-radius:10px;padding:6px;display:none;box-shadow:0 12px 34px rgba(0,0,0,.6);font-size:13px;user-select:none}
.ctx-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;color:#dfe4f0;white-space:nowrap}
.ctx-item:hover{background:#7c3aed;color:#fff}
.ctx-item.danger{color:#ff7b7b}
.ctx-item.danger:hover{background:#dc2626;color:#fff}
.ctx-item.disabled{opacity:.35;cursor:not-allowed}
.ctx-item.disabled:hover{background:transparent;color:#dfe4f0}
.ctx-ico{width:16px;text-align:center;flex-shrink:0;font-size:13px}
.ctx-label{flex:1}
.ctx-hint{font-size:11px;color:#8892ab;margin-left:18px}
.ctx-item:hover .ctx-hint{color:#f3e8ff}
.ctx-sep{height:1px;background:#2a3046;margin:5px 8px}
.ctx-title{padding:5px 10px 7px;font-size:11px;color:#7f8aa3;letter-spacing:.4px}
#toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(10px);background:#1c2030;border:1px solid #3d4358;color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:300}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hint-bar{position:fixed;right:12px;bottom:16px;font-size:11px;color:#6b7488;background:rgba(20,22,31,.85);padding:7px 11px;border-radius:8px;border:1px solid #252a3d;z-index:10;line-height:1.7}
.hint-bar b{color:#9aa4bd;font-weight:500}
.wait-mask{position:fixed;inset:0;background:rgba(5,6,10,.72);display:none;align-items:center;justify-content:center;z-index:400}
.wait-mask.show{display:flex}
.wait-box{background:#1c2030;border:1px solid #3d4358;border-radius:14px;padding:24px 28px;width:380px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.6)}
.wait-spin{width:46px;height:46px;margin:0 auto 14px;border:4px solid #3d4358;border-top-color:#7c3aed;border-radius:50%;animation:wa-spin 1s linear infinite}
@keyframes wa-spin{to{transform:rotate(360deg)}}
.wait-title{font-size:15px;margin-bottom:6px}
.wait-msg{font-size:13px;color:#c3cbdc;min-height:20px;line-height:1.6}
.wait-sub{font-size:12px;color:#8892ab;margin:8px 0 16px}
.wait-cancel{background:#2d3348;color:#ffd7d7;border:1px solid #4a3550;padding:7px 18px;border-radius:6px;cursor:pointer;font-size:13px}
.wait-cancel:hover{background:#dc2626;color:#fff}
.wait-warn{font-size:12px;color:#fbbf24;margin:2px 0 14px}
.wait-raw{display:none;max-height:130px;overflow:auto;font-size:11px;color:#9fe3c0;background:#0a0b10;border:1px solid #2d3348;border-radius:6px;padding:6px 8px;margin:0 0 12px;text-align:left;white-space:pre-wrap;word-break:break-all}
@media (max-width:640px),(pointer:coarse){
  .modal-content{width:calc(100vw - 20px);max-height:calc(100dvh - 40px);overflow-y:auto}
  .edit-modal{left:10px!important}
  .toolbar{top:56px;padding:6px;gap:6px}
  .tool-btn{width:40px;height:40px;font-size:17px}
  .zoom-bar{bottom:10px;padding:4px 8px}
  .zoom-bar button{width:34px;height:34px}
  .hint-bar{display:none}
  .top-bar{padding:0 8px}
  .ctx-menu{min-width:186px;font-size:14px}
  .ctx-item{padding:10px 12px}
}
</style>
</head>
<body>
<div class="top-bar" id="topBar"></div>
<canvas id="cv"></canvas>
<div class="toolbar">
  <button class="tool-btn" onclick="addNode()" title="新增节点">+</button>
  <button class="tool-btn" onclick="openAIModal()" title="AI生成">✨</button>
  <button class="tool-btn" onclick="chainSelected()" title="连接两个节点【先点第一个节点，点这个按钮，再点第二个】">🔗</button>
  <button class="tool-btn" onclick="selectAll()" title="全选所有节点">▣</button>
  <button class="tool-btn" onclick="delSel()" title="删除选中">🗑</button>
  <button class="tool-btn" onclick="uploadAsset()" title="上传图片/视频素材">🖼</button>
  <button class="tool-btn" onclick="exportPNG()" title="导出画布截图">📸</button>
  <button class="tool-btn" onclick="exportSelectedContents()" title="导出选中卡片的内容(文字/图片/视频)">📤</button>
  <button class="tool-btn" id="setBtn" onclick="openSettings()" title="自动保存设置">⚙️</button>
  <button class="tool-btn" onclick="syncBtnClick()" title="数据文件夹：立即备份/恢复（配合微力同步）">🔄</button>
  <button class="tool-btn" onclick="exportJSON()" title="导出项目文件">💾</button>
  <button class="tool-btn" onclick="importJSON()" title="导入项目文件">📂</button>
</div>
<div class="zoom-bar">
  <button onclick="zoomOut()">-</button>
  <span id="zoomLabel">100%</span>
  <button onclick="zoomIn()">+</button>
  <button onclick="fitContent()" title="定位到全部内容">⛶</button>
</div>
<div class="hint-bar">
  <div><b>左键拖拽</b> 框选 · <b>Shift</b> 追加</div>
  <div><b>中键</b> 或 <b>空格+左键</b> 平移</div>
  <div><b>右键</b> 菜单 · <b>滚轮</b> 缩放</div>
  <div><b>拖拽圆点</b> 连线 · <b>单击连线</b> 选中</div>
  <div><b>Delete</b> 删除选中连线 · <b>Esc</b> 取消</div>
  <div><b>左下角导航图</b> 点击/拖拽瞬移 · <b>⛶</b> 定位全部内容</div>
</div>
<div class="modal" id="aiModal">
  <div class="modal-content">
    <h3 id="aiModalTitle">AI生成分镜</h3>
    <div class="form-row" id="cardTitleRow" style="display:none">
      <label>卡片改名</label>
      <input id="aiCardTitle" placeholder="这张卡片的标题">
    </div>
    <div class="form-row" id="cardTextRow" style="display:none">
      <label>文本内容</label>
      <textarea id="aiCardText" placeholder="卡片上的文字"></textarea>
    </div>
    <div class="form-row">
      <label>类型</label>
      <select id="aiType" onchange="aiTypeChange()">
        <option value="video">视频</option>
        <option value="image">图片</option>
        <option value="text">文本脚本</option>
      </select>
    </div>
    <div class="form-row">
      <label>提示词</label>
      <textarea id="aiPrompt" placeholder="描述画面"></textarea>
    </div>
    <div class="form-row">
      <label>参考素材</label>
      <button class="btn-secondary" onclick="uploadAIRef()" style="flex:1">📎 上传参考素材（图/视频/文本等）</button>
    </div>
    <div id="aiRefTip" style="font-size:12px;color:#94a3b8;margin:4px 0 8px 80px"></div>
    <div class="form-row">
      <label>连线参考</label>
      <button class="btn-secondary" onclick="rebuildLinkRefList()" style="flex:1;font-size:12px;padding:6px 10px">🔄 刷新连线清单</button>
    </div>
    <div id="linkRefBox" style="margin:0 0 10px 80px;font-size:12px;max-height:170px;overflow-y:auto;background:#0a0b10;border:1px solid #2d3348;border-radius:8px;padding:6px 8px;line-height:1.5"></div>
    <div class="form-row" id="ratioRow">
      <label>画面比例</label>
      <select id="aiRatio">
        <option value="16:9">16:9 横屏</option>
        <option value="9:16">9:16 竖屏短剧</option>
        <option value="1:1">1:1 正方形</option>
      </select>
    </div>
    <div class="form-row" id="kRow">
      <label>清晰度</label>
      <select id="aiK">
        <option value="1">1K</option>
        <option value="2">2K</option>
        <option value="4">4K</option>
      </select>
    </div>
    <div class="form-row" id="durationRow">
      <label>视频时长</label>
      <input type="number" id="aiDuration" value="5" min="4" max="12">
    </div>
    <div class="form-row" id="seedRow">
      <label>随机种子</label>
      <input type="number" id="aiSeed" value="-1">
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeAIModal()">取消</button>
      <button class="btn-primary" onclick="runAI()">开始生成</button>
    </div>
  </div>
</div>

<div class="modal" id="recoverModal">
  <div class="modal-content" style="width:520px">
    <h3>📁 恢复数据</h3>
    <div id="rcvBody" style="max-height:320px;overflow-y:auto;font-size:13px"></div>
    <div class="form-row" style="margin-top:10px">
      <button class="btn-secondary" onclick="document.getElementById('rcvFile').click()">📂 选择备份文件</button>
      <input type="file" id="rcvFile" accept=".json" multiple style="display:none" onchange="recoverFileInput(event)">
      <button class="btn-secondary" onclick="closeRecoverModal()">跳过，直接进入</button>
    </div>
    <div style="font-size:11px;color:#6b7488">备份文件名=项目名，同名自动覆盖；由微力同步在多设备间搬运</div>
  </div>
</div>

<div class="edit-modal" id="editModal">
  <label>节点标题</label>
  <input type="text" id="editTitle" style="width:100%">
  <label>文本内容</label>
  <textarea id="editText"></textarea>
  <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end">
    <button class="btn-secondary" onclick="closeEditModal()">取消</button>
    <button class="btn-primary" onclick="saveEdit()">保存</button>
  </div>
</div>

<div class="modal" id="setModal">
  <div class="modal-content" style="width:430px">
    <h3>⚙️ 自动保存设置</h3>
    <div class="form-row">
      <label>自动保存</label>
      <label style="width:auto;flex:1;display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.5">
        <input type="checkbox" id="setAutoSave" style="flex:0 0 auto;margin-top:3px;width:auto">
        <span>每次操作自动保存到浏览器<br><small style="color:#8892ab">关闭后改动只在内存，需手动点"立即保存"；刷新页面会丢未保存内容</small></span>
      </label>
    </div>
    <div class="form-row">
      <label>自动备份</label>
      <label style="width:auto;flex:1;display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.5">
        <input type="checkbox" id="setAutoBackup" style="flex:0 0 auto;margin-top:3px;width:auto">
        <span>同步写入数据文件夹<br><small style="color:#8892ab">需先用 🔄 连接文件夹（配合微力同步跨设备）</small></span>
      </label>
    </div>
    <div class="form-row">
      <label>备份频率</label>
      <select id="setMode">
        <option value="now">操作后立即备份</option>
        <option value="30s">每 30 秒备份一次</option>
        <option value="5m">每 5 分钟备份一次</option>
        <option value="manual">仅手动备份</option>
      </select>
    </div>
    <div class="form-row">
      <label>保存路径</label>
      <span id="setPathName" style="flex:1;font-size:13px;color:#cdd5e1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">未选择</span>
      <button class="btn-secondary" onclick="changeSyncFolder()" style="flex:0 0 auto;font-size:12px;padding:6px 10px">📁 更改路径</button>
    </div>
    <div style="font-size:12px;color:#8892ab;margin:4px 0 12px" id="setLastTime"></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="saveNowClick()">💾 立即保存</button>
      <button class="btn-secondary" onclick="closeSettings()">取消</button>
      <button class="btn-primary" onclick="saveSettings()">保存设置</button>
    </div>
  </div>
</div>
<div class="ctx-menu" id="ctxMenu"></div>
<div id="toast"></div>
<div class="wait-mask" id="waitMask">
  <div class="wait-box">
    <div class="wait-spin"></div>
    <div class="wait-title">视频生成排队中</div>
    <div class="wait-msg" id="waitMsg">正在提交任务…</div>
    <div class="wait-sub" id="waitSub">已等待 00:00</div>
    <pre class="wait-raw" id="waitRaw"></pre>
    <div class="wait-warn">⚠ 生成期间请不要关闭或刷新页面</div>
    <button class="wait-cancel" onclick="cancelWait()">取消任务</button>
  </div>
</div>

<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const isTouchDevice=('ontouchstart' in window)||navigator.maxTouchPoints>0;
let W=cv.width=innerWidth,H=cv.height=innerHeight;
let camX=0,camY=0,zoom=1;
let nodes=[],edges=[];
let selected=null;
let selectedNodes=new Set();
let lastSelected=null;
const imgCache={};
let dragN=null;
let dragNodes=null;
let pressInfo=null;
let panStart=null;
let marquee=null;
let spaceDown=false;
let clipboard=[];
let ctxTarget=null;
let currentProjectId=null;
let activeVideoNode=null;
let rafId=null;
let connectPendingNode=null;
let portDrag=null;
let navDown=false;
let selectedEdge=null;
let editTargetNode=null;
const API_BASE='https://api.agnes-ai.cn/v1';
const API_KEY='sk-pVsYipjj0gZgzf9xionpcneAekuTyWEpr5G7RAwbBOcRrhr1';
let refImageBlob=null;
let refVideoBlob=null;
let refTextExtra=null;
let linkRefPool=[];
let aiTargetNode=null;
let pendingTarget=null;

function world(x,y){return {x:(x-camX)/zoom,y:(y-camY)/zoom}}
function screen(x,y){return {x:x*zoom+camX,y:y*zoom+camY}}
function getViewCenterPos(){return world(W/2,H/2)}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
let toastTimer=null;
function toast(msg){
  const el=document.getElementById('toast');
  el.innerText=msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),1600);
}
function blobToBase64(blob){
  return new Promise(resolve=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result);
    r.readAsDataURL(blob);
  })
}

function setSelection(arr,additive){
  const list=(arr||[]).filter(Boolean);
  if(!additive)selectedNodes.clear();
  list.forEach(n=>selectedNodes.add(n));
  const all=[...selectedNodes];
  lastSelected=list.length?list[list.length-1]:(all.length?all[all.length-1]:null);
  selected=lastSelected;
}
function hitNode(m){
  for(let i=nodes.length-1;i>=0;i--){
    const n=nodes[i];
    if(m.x>n.x&&m.x<n.x+n.w&&m.y>n.y&&m.y<n.y+n.h)return n;
  }
  return null;
}
function rectsIntersect(a,b){
  return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
}
function selectAll(){
  if(!nodes.length)return toast('画布上还没有节点');
  setSelection(nodes);
  toast('已全选 '+nodes.length+' 个节点');
  draw();
}

function sleepVideo(node){
  if(!node.isVideo||!node.videoEl)return;
  captureVideoSnap(node);
  node.videoEl.pause();
  node.videoEl.src='';
  node.videoPlaying=false;
  if(activeVideoNode===node)activeVideoNode=null;
}
function wakeVideo(node){
  if(!node.isVideo||!node._objectUrl)return;
  ensureVideoEl(node);
  if(!node.videoEl)return;
  node.videoEl.src=node._objectUrl;
  node.videoPlaying=true;
  activeVideoNode=node;
}
function captureVideoSnap(node){
  if(!node.videoEl)return;
  const v=node.videoEl;
  if(v.readyState<2)return;
  const c=document.createElement('canvas');
  c.width=v.videoWidth;
  c.height=v.videoHeight;
  const cc=c.getContext('2d');
  try{cc.drawImage(v,0,0);node.videoSnap=c;}catch(e){}
}
function ensureVideoEl(n){
  if(n.isVideo&&n._objectUrl&&(!n.videoEl||typeof n.videoEl.pause!=='function')){
    const v=document.createElement('video');
    v.src=n._objectUrl;
    attachVideo(n,v);
  }
}
function destroyVideo(node){
  try{
    if(node.audioEl){node.audioEl.pause();node.audioEl=null;}
  }catch(e){}
  try{
    if(node.videoEl&&typeof node.videoEl.pause==='function')sleepVideo(node);
  }catch(e){}
  if(node._objectUrl){try{URL.revokeObjectURL(node._objectUrl);}catch(e){}}
  node.videoEl=null;node.videoSnap=null;node.videoPlaying=false;
}
function serializeEdges(){
  return edges.map(e=>({a:nodes.indexOf(e.a),b:nodes.indexOf(e.b)})).filter(e=>e.a>=0&&e.b>=0);
}
function deserializeEdges(list,nodesArr){
  return (list||[]).map(e=>{
    if(!e)return null;
    if(typeof e.a==='number'&&typeof e.b==='number')return {a:nodesArr[e.a],b:nodesArr[e.b]};
    if(e.a&&e.b){
      const fa=nodesArr.find(n=>n.x===e.a.x&&n.y===e.a.y&&n.title===e.a.title);
      const fb=nodesArr.find(n=>n.x===e.b.x&&n.y===e.b.y&&n.title===e.b.title);
      if(fa&&fb)return {a:fa,b:fb};
    }
    return null;
  }).filter(e=>e&&e.a&&e.b);
}
// 节点序列化：把不可直接 JSON 化的内容（如画布快照）"编译"成字符串，保存时不丢内容
function serializeNodes(nodesArr){
  return (nodesArr||[]).map(n=>{
    const out={};
    // 拷贝所有可序列化属性，跳过 DOM 元素和运行时状态
    for(const k of Object.keys(n)){
      const v=n[k];
      if(v==null)continue;
      if(k==='videoEl'||k==='audioEl')continue; // DOM 元素，加载时重建
      if(k==='videoSnap')continue; // 画布元素，单独编译
      if(k==='_restoredFrom')continue; // 临时引用，不保存
      if(k==='_fitted'){out[k]=v;continue;}
      if(typeof v==='object'&&!(v instanceof Array)&&v.tagName)continue; // 其他 DOM 元素
      out[k]=v;
    }
    // 编译视频快照画布 → base64（保存画面内容，恢复后立即显示）
    if(n.videoSnap&&n.videoSnap.getContext&&n.videoSnap.width>0){
      try{out._videoSnapB64=n.videoSnap.toDataURL('image/jpeg',0.82);}catch(e){}
    }
    return out;
  });
}
// 节点反序列化：把 base64 等"编译后"的数据还原回画布/运行时对象
function deserializeNodes(nodesArr){
  return (nodesArr||[]).map(n=>{
    n.videoEl=null;n.audioEl=null;n.videoPlaying=false;
    // 编译回：base64 → 画布元素，作为视频快照立即显示
    if(n._videoSnapB64){
      try{
        const c=document.createElement('canvas');
        const img=new Image();
        img.onload=()=>{
          try{
            c.width=img.naturalWidth;c.height=img.naturalHeight;
            c.getContext('2d').drawImage(img,0,0);
            n.videoSnap=c;
            draw();
          }catch(e){n.videoSnap=null;}
        };
        img.onerror=()=>{n.videoSnap=null;};
        img.src=n._videoSnapB64;
        // 如果图片已缓存完成（naturalWidth 立即可用），直接画上去
        if(img.naturalWidth>0){
          c.width=img.naturalWidth;c.height=img.naturalHeight;
          c.getContext('2d').drawImage(img,0,0);
          n.videoSnap=c;
        }
      }catch(e){n.videoSnap=null;}
      delete n._videoSnapB64;
    }else{
      n.videoSnap=null;
    }
    return n;
  });
}

        }

// MIME → 常用扩展名
function mimeExt(m){
  const map={
    'image/png':'png','image/jpeg':'jpg','image/webp':'webp','image/gif':'gif',
    'video/mp4':'mp4','video/webm':'webm','video/quicktime':'mov',
    'audio/mpeg':'mp3','audio/mp3':'mp3','audio/wav':'wav','audio/x-m4a':'m4a','audio/aac':'aac','audio/ogg':'ogg',
    'text/plain':'txt','text/markdown':'md','text/csv':'csv','application/json':'json',
    'application/pdf':'pdf','application/msword':'doc',
    'application/vnd.openxmlformats-officedocument.wordprocessingml.document':'docx',
    'application/vnd.ms-excel':'xls',
    'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':'xlsx',
    'application/zip':'zip'
  };
  return map[m]||'';
}

// 导出单张卡片内容：文字→txt，图片/视频→媒体文件，本地文件→原文件
async function exportNodeContent(n){
  if(!n)return toast('请先选中要导出的卡片');
  const base=safeFileName(n.title);
  if(n.type==='text'&&!n._fileId){
    const body=(n.text||'').trim();
    if(!body)return toast('这张文字卡还没有内容');
    dlBlob(new Blob(['【'+(n.title||'')+'】\n'+body],{type:'text/plain;charset=utf-8'}),base+'.txt');
    return toast('已导出文字卡：'+base+'.txt');
  }
  // 本地上传的文件优先从库里取原件
  if(n._fileId){
    try{
      const b=await fileDB.get(n._fileId);
      if(b){
        // 优先用上传时记录的 MIME 推断扩展名
        let ext=((n.fileMime&&mimeExt(n.fileMime))||(n.type==='img'?'png':n.type==='video'?'mp4':n.type==='audio'?'mp3':n.type==='text'?'txt':'dat'));
        const name=/\.[a-z0-9]{2,5}$/i.test(base)?base:base+'.'+ext;
        dlBlob(b,name);
        return toast('已导出本地文件：'+name);
      }
    }catch(e){}
  }
  if(n.src&&(n.type==='img'||n.isVideo||n.type==='video')){
    try{
      const r=await fetch(n.src);
      if(!r.ok)throw new Error('HTTP '+r.status);
      const b=await r.blob();
      const ext=n.isVideo||n.type==='video'?'mp4':(/webp/i.test(b.type)?'webp':/gif/i.test(b.type)?'gif':'png');
      dlBlob(b,base+'.'+ext);
      return toast('已导出'+(n.isVideo||n.type==='video'?'视频':'图片')+'：'+base+'.'+ext);
    }catch(e){
      // 跨域拿不到二进制就新标签打开 + 复制链接
      const w=window.open(n.src,'_blank');
      try{await navigator.clipboard.writeText(n.src);}catch(_){}
      toast('媒体地址受跨域限制无法直接下载'+(w?'，已在新标签打开，链接已复制到剪贴板':'，链接已复制到剪贴板'));
      return;
    }
  }
  if(n.src&&n.type==='doc'){openDocNode(n);return;}
  if(n.src&&n.type==='audio'){
    try{
      const r=await fetch(n.src);
      dlBlob(await r.blob(),base+'.mp3');
      return toast('已导出音频：'+base);
    }catch(e){return toast('音频文件已失效，请重新上传');}
  }
  toast('这张卡片还没有可导出的内容');
}

function zoomAt(factor,sx,sy){
  const px=(sx===undefined?W/2:sx),py=(sy===undefined?H/2:sy);
  const wx=(px-camX)/zoom,wy=(py-camY)/zoom;
  zoom=Math.min(20,Math.max(0.01,zoom*factor));
  camX=px-wx*zoom;
  camY=py-wy*zoom;
  updateZoomText();
}
function zoomIn(){zoomAt(1.1)}
function zoomOut(){zoomAt(1/1.1)}
function fitView(){zoom=1;camX=0;camY=0;updateZoomText();draw()}
// 缩放到恰好框住全部节点（四周留边距），空画布则回原点
function fitContent(){
  if(!nodes.length){fitView();return;}
  let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;
  nodes.forEach(n=>{a=Math.min(a,n.x);b=Math.min(b,n.y);c=Math.max(c,n.x+n.w);d=Math.max(d,n.y+n.h);});
  const pad=80;a-=pad;b-=pad;c+=pad;d+=pad;
  zoom=Math.min(20,Math.max(0.01,Math.min(W/(c-a),H/(d-b))));
  camX=(W-(a+c)*zoom)/2;
  camY=(H-(b+d)*zoom)/2;
  updateZoomText();
  draw();
  toast('已定位到全部内容');
}
function updateZoomText(){document.getElementById('zoomLabel').innerText=Math.round(zoom*100)+'%'}

// ---- 自动备份/恢复（数据文件夹 + 微力同步）----
// 约定：每次操作自动把项目写成 <项目名>.json（同名覆盖）；进入页面弹出恢复选择。
// 浏览器无法全盘扫描磁盘：电脑端用记住的文件夹目录自动扫描；手机端用系统文件选择器
//（在微力同步目录里挑备份文件）。
let syncHandle=null;
let syncing=false;
let syncKickTimer=null;
// 收集节点引用的 IndexedDB 文件，内嵌为 base64（同名 fid），让备份自带内容
async function embedProjectFiles(proj){
  const nodes=proj.nodes||[];
  const ids=[...new Set(nodes.filter(n=>n&&n._fileId).map(n=>n._fileId))];
  const files={};
  let bytes=0,missing=0;
  for(const fid of ids){
    try{
      const b=await fileDB.get(fid);
      if(!b){missing++;continue;}
      bytes+=b.size;
      files[fid]=await blobToBase64(b);
    }catch(e){missing++;}
  }
  return {files,bytes,need:ids.length,missing};
}

const syncKV=(()=>{
  let dbp=null;
  function open(){
    if(dbp)return dbp;
    dbp=new Promise((res,rej)=>{
      const rq=indexedDB.open('pavo_sync',1);
      rq.onupgradeneeded=ev=>{ev.target.result.createObjectStore('kv');};
      rq.onsuccess=()=>res(rq.result);

  }
  return {
    async get(k){const db=await open();return new Promise(res=>{const rq=db.transaction('kv').objectStore('kv').get(k);rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>res(null);});},
    async set(k,v){const db=await open();return new Promise(res=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>res();});}
  };
})();
async function ensureSyncPerm(silent){
  try{
    const h=await syncKV.get('dir');
    if(!h||!h.queryPermission)return null;
    let perm=await h.queryPermission({mode:'readwrite'});
    if(perm!=='granted'&&!silent){
      try{perm=await h.requestPermission({mode:'readwrite'});}catch(e){return null;}
    }
    if(perm==='granted'){syncHandle=h;return h;}
    return null;
  }catch(e){return null;}
}
function syncFileName(proj,id,allNames){
  let nm=proj.name||('项目_'+String(id).slice(-6));
  nm=String(nm).replace(/[\\/:*?"<>|]/g,'_').slice(0,60);
  let fn=nm+'.json';
  // 多个项目同名时，加 id 后缀防互相覆盖
  if(allNames&&allNames.get(fn)&&allNames.get(fn)!==id)fn=nm+'_'+String(id).slice(-6)+'.json';
  return fn;
}
async function writeAllToFolder(p){
  if(!syncHandle)return 0;
  const allNames=new Map();
  Object.keys(p).forEach(id=>{
    const nm=p[id].name||('项目_'+String(id).slice(-6));
    const base=String(nm).replace(/[\\/:*?"<>|]/g,'_').slice(0,60)+'.json';
    if(!allNames.has(base))allNames.set(base,id); // 同名时先注册者保留原文件名
  });
  let n=0,bigWarned=0,missTotal=0;
  for(const id of Object.keys(p)){
    const proj=p[id];
    try{
      const {files,bytes,missing}=await embedProjectFiles(proj);
      missTotal+=missing||0;
      if(bytes>60*1024*1024&&bigWarned<3){
        bigWarned++;
        toast('⚠ 「'+(proj.name||id)+'」上传素材约 '+Math.round(bytes/1048576)+'MB，备份文件会很大');
      }
      const fn=syncFileName(proj,id,allNames);
      const fh=await syncHandle.getFileHandle(fn,{create:true});
      const w=await fh.createWritable();
      await w.write(JSON.stringify(Object.assign({projectId:id},proj,{_files:files})));
      await w.close();n++;
    }catch(e){console.error('backup fail',id,e);}
  }
  if(missTotal){toast('⚠ '+missTotal+' 个素材文件在本机库中缺失（可能属于其它设备浏览器），未能内嵌');}
  return n;
}
async function trySync(manual){
  if(!syncHandle||syncing)return;
  syncing=true;
  try{
    const p=loadProjects();
    // 关键：把内存中的实时画面并入待备份数据——自动保存被关闭时，
    // localStorage 里是旧版本，直接备份会丢刚才的编辑（卡片不全的根因之一）
    if(currentProjectId&&Array.isArray(nodes)){
      p[currentProjectId]=Object.assign({},p[currentProjectId]||{},{nodes:serializeNodes(nodes),edges:serializeEdges(),camX,camY,zoom,updated:Date.now()});
    }
    const n=await writeAllToFolder(p);
    if(n){SETTINGS.lastBackup=Date.now();try{localStorage.setItem('pavo_settings',JSON.stringify(SETTINGS));}catch(e){}}
    if(manual){
      const cur=p[currentProjectId];
      const cn=cur&&cur.nodes?cur.nodes.length:0;
      toast(n?('✅ 已备份 '+n+' 个项目 · 当前项目 '+cn+' 张卡片（含全部卡片数据，素材已内嵌）'):'保存失败：文件夹不可写');

// 扫描文件夹里的备份 json（只取前 40 个）
async function scanFolderBackups(){
  const list=[];
  if(!syncHandle)return list;
  let count=0;
  try{
    for await (const entry of syncHandle.values()){
      if(count++>=40)break;
      if(entry.kind!=='file'||!/\.json$/i.test(entry.name))continue;
      try{
        const f=await entry.getFile();
        const d=JSON.parse(await f.text());
        if(!d||!Array.isArray(d.nodes))continue;
        list.push({rec:d,file:f.name,size:f.size,mtime:f.lastModified,nfiles:d._files?Object.keys(d._files).length:0});
      }catch(e){}
    }
  }catch(e){}
  return list;
}
// 备份里内嵌的 _files 写回本机 IndexedDB，恢复引用内容
async function restoreEmbeddedFiles(rec){
  if(!rec||!rec._files)return 0;
  let n=0;
  // 用 fetch 替代同步 XHR：同步 XHR 不支持 responseType='blob'，会导致文件恢复静默失败
  for(const fid of Object.keys(rec._files)){
    try{
      const blob=await(await fetch(rec._files[fid])).blob();
      if(blob&&blob.size>0){await fileDB.put(fid,blob);n++;}
    }catch(e){console.error('restoreEmbeddedFiles fail',fid,e);}
  }
  return n;
}

// ---- 本地文件仓库（IndexedDB）：上传的原始文件永久存在浏览器库里 ----
const fileDB=(()=>{
  let dbp=null;
  function openDB(){
    if(dbp)return dbp;
    dbp=new Promise((res,rej)=>{
      const rq=indexedDB.open('pavo_files',1);
      rq.onupgradeneeded=ev=>{ev.target.result.createObjectStore('files',{keyPath:'id'})};
      rq.onsuccess=()=>res(rq.result);
      rq.onerror=()=>rej(rq.error);
    });
    return dbp;
  }
  return {
    async put(id,blob){
      const db=await openDB();
      return new Promise((res,rej)=>{
        const tx=db.transaction('files','readwrite');
        tx.objectStore('files').put({id:id,data:blob});
        tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);
      });
    },
    async get(id){
      const db=await openDB();
      return new Promise((res,rej)=>{
        const rq=db.transaction('files').objectStore('files').get(id);
        rq.onsuccess=()=>res(rq.result?rq.result.data:null);
        rq.onerror=()=>rej(rq.error);
      });
    },
    async del(id){
      const db=await openDB();
      return new Promise(res=>{
        const tx=db.transaction('files','readwrite');
        tx.objectStore('files').delete(id);
        tx.oncomplete=()=>res();tx.onerror=()=>res();
      });
    }
  };
})();

// 从 docx(zip) 中解压指定条目
async function unzipEntry(buf, entryName){
  const dv=new DataView(buf);
  const bytes=new Uint8Array(buf);
  let cdOff=-1;
  for(let i=buf.byteLength-22;i>=0;i--){
    if(dv.getUint32(i,true)===0x06054b50){cdOff=dv.getUint32(i+16,true);break;}
  }
  if(cdOff<0)throw new Error('不是有效的 zip/docx 文件');
  let p=cdOff;
  while(p+46<=buf.byteLength&&dv.getUint32(p,true)===0x02014b50){
    const method=dv.getUint16(p+10,true);
    const compSize=dv.getUint32(p+20,true);
    const fnLen=dv.getUint16(p+28,true);
    const exLen=dv.getUint16(p+30,true);
    const cmLen=dv.getUint16(p+32,true);
    const lho=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(bytes.slice(p+46,p+46+fnLen));
    if(name===entryName){
      const lFn=dv.getUint16(lho+26,true), lEx=dv.getUint16(lho+28,true);
      const dataStart=lho+30+lFn+lEx;
      const data=bytes.slice(dataStart,dataStart+compSize);
      if(method===0)return data;
      const ds=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return new Uint8Array(await new Response(ds).arrayBuffer());
    }
    p+=46+fnLen+exLen+cmLen;
  }
  throw new Error('docx 里找不到 '+entryName);
}
// docx -> 纯文本（段落分行）
async function docxToText(file){
  const xml=new TextDecoder('utf-8').decode(await unzipEntry(await file.arrayBuffer(),'word/document.xml'));
  const doc=new DOMParser().parseFromString(xml,'application/xml');
  if(doc.getElementsByTagName('parsererror').length)throw new Error('document.xml 解析失败');
  const out=[];
  doc.getElementsByTagName('w:p').forEach(p=>{
    let line='';
    p.querySelectorAll('w:t').forEach(t=>{line+=t.textContent;});
    out.push(line);
  });
  return out.join('\n').replace(/\n{3,}/g,'\n\n').trim();
}
function isTextLike(f){
  return f.type.startsWith('text/')||/\.(txt|md|markdown|csv|json|srt|lrc)$/i.test(f.name);
}
function fmtSize(b){
  return b>1048576?(b/1048576).toFixed(1)+'MB':Math.max(1,Math.round(b/1024))+'KB';
}
function uploadAIRef(){
  const i=document.createElement('input');
  i.type='file';
  i.accept='image/*,video/*,audio/*,.txt,.md,.markdown,.csv,.json,.pdf,.doc,.docx,.srt';
  i.onchange=async e=>{
    const f=e.target.files[0];
    if(!f)return;
    if(f.type.startsWith('image/')){
      refImageBlob=f;refVideoBlob=null;refTextExtra=null;
      document.getElementById('aiRefTip').innerText='✅ 已加载参考图：'+f.name;
    }else if(f.type.startsWith('video/')){
      refVideoBlob=f;refImageBlob=null;refTextExtra=null;
      document.getElementById('aiRefTip').innerText='✅ 已加载参考视频：'+f.name;
    }else if(/\.docx$/i.test(f.name)||f.type==='application/vnd.openxmlformats-officedocument.wordprocessingml.document'){
      document.getElementById('aiRefTip').innerText='⏳ 正在把《'+f.name+'」转成文字…';
      try{
        const t=await docxToText(f);
        if(!t)throw new Error('没读到正文');
        refTextExtra=t.slice(0,200*1024);
        refImageBlob=null;refVideoBlob=null;
        document.getElementById('aiRefTip').innerText='📝 已自动转写《'+f.name+'」：共 '+t.length+' 字，生图/生视频将作为【参考剧本/资料】注入提示词'+(t.length>200*1024?'（超长已截断）':'');
      }catch(err){
        document.getElementById('aiRefTip').innerText='❌ Word 转文字失败：'+err.message+'（可用 Word 另存为 .txt 再上传）';
      }
    }else if(/\.pdf$/i.test(f.name)||f.type==='application/pdf'){
      document.getElementById('aiRefTip').innerText='📕 PDF 无法在浏览器内直接转文字：请用 Word 打开另存为 .docx 或 .txt 再上传；或点 🖼 存进画布留档';
    }else if(/\.doc$/i.test(f.name)){
      document.getElementById('aiRefTip').innerText='📕 老版 .doc 无法解析：请用 Word 另存为 .docx 或 .txt 再上传';
    }else if(isTextLike(f)){
      if(f.size>200*1024){
        document.getElementById('aiRefTip').innerText='⚠ 文本文件超过 200KB，只取前 200KB';
      }

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
// 从视频 blob 取首帧 dataURL，作为图片生成的画面参考
function videoFirstFrame(blob){
  return new Promise(res=>{
    try{
      const url=URL.createObjectURL(blob);
      const v=document.createElement('video');
      v.muted=true;v.preload='auto';
      let done=false;
      const fin=(out)=>{if(done)return;done=true;URL.revokeObjectURL(url);res(out);};
      v.addEventListener('loadeddata',()=>{
        try{
          const c=document.createElement('canvas');
          c.width=v.videoWidth||512;c.height=v.videoHeight||512;
          c.getContext('2d').drawImage(v,0,0,c.width,c.height);
          fin(c.toDataURL('image/jpeg',0.85));
        }catch(e){fin(null);}
      });
      v.addEventListener('error',()=>fin(null));
      setTimeout(()=>fin(null),6000);
      v.src=url;
    }catch(e){res(null);}
  });
}
// 依据锚点卡片重建可勾选的连线参考清单
function buildLinkRefList(anchor){
  const pool=linkedNodesOf(anchor);
  linkRefPool=[];
  const el=document.getElementById('linkRefBox');
  if(!el)return;
  if(!pool.length){
    el.innerHTML='<div style="color:#6b7488;padding:2px">画布上还没有可参考的连线内容<br>用卡片两侧圆点连线后点"刷新连线清单"</div>';
    return;
  }
  pool.forEach(n=>{
    let kind='na',note='无可用内容';
    if(n.isVideo||n.type==='video'){kind='video';note='画面快照';}
    else if(n.type==='img'&&n.src){kind='img';note='参考画面';}
    else if(n.type==='text'&&n.text){kind='text';note='注入提示词';}
    else if(n.type==='audio'){kind='na';note='模型不支持音频';}
    else if(n.type==='doc'||n._fileId){kind='na';note='模型不支持该文件';}
    linkRefPool.push({n,kind,note,checked:(kind==='img'||kind==='video'||kind==='text')});
  });
  renderLinkRefList(anchor);
}
function renderLinkRefList(anchor){
  const el=document.getElementById('linkRefBox');

// 收集连线参考：优先以当前选中节点为锚，否则取所有参与连线的节点
function linkedNodesOf(anchor){
  const out=[];
  if(anchor){
    edges.forEach(e=>{
      if(!e.a||!e.b)return;
      if(e.a===anchor)out.push(e.b);
      else if(e.b===anchor)out.push(e.a);
    });
    return out;
  }
  const seen=new Set();
  edges.forEach(e=>{
    if(!e.a||!e.b)return;
    [e.a,e.b].forEach(n=>{if(!seen.has(n)){seen.add(n);out.push(n);}});
  });
  return out;
}
async function collectLinkedRefs(){
  const imgs=[], texts=[], diag=[];
  if(!linkRefPool.length){
    diag.push('连线清单为空：画布还没有连线，或连线卡片没有可用内容');
    return {imgs,texts,diag};
  }
  for(const it of linkRefPool){
    const tag=(it.n.title||it.n.type||'?');
    if(!it.checked){diag.push('⏭ '+tag+'：已取消勾选，本次不带');continue;}
    if(it.kind==='video'){
      if(it.n.videoSnap){
        try{imgs.push(it.n.videoSnap.toDataURL('image/jpeg',0.85));diag.push('🎬 '+tag+'：画面快照已带上');}
        catch(e){diag.push('🎬 '+tag+'：快照跨域不可用，未带上');}
      }else diag.push('🎬 '+tag+'：无画面快照（先双击播放一次再刷新清单），未带上');
      continue;
    }
    if(it.kind==='img'){
      const n=it.n;
      if(/^https?:/i.test(n.src)){imgs.push(n.src);diag.push('🖼 '+tag+'：云端图 URL 已带上');}
      else if(n.src&&n.src.startsWith('blob:')){
        try{
          const b=await(await fetch(n.src)).blob();
          if(b.size<=8*1024*1024){imgs.push(await blobToBase64(b));diag.push('🖼 '+tag+'：本地图已转码带上');}
          else diag.push('🖼 '+tag+'：本地图超 8MB，未带上');
        }catch(e){diag.push('🖼 '+tag+'：本地图读取失败，未带上');}
      }else diag.push('🖼 '+tag+'：地址格式未知，未带上');
      continue;
    }
    if(it.kind==='text'){
      texts.push(String(it.n.text).slice(0,2000));
      diag.push('📃 '+tag+'：文字已注入提示词');
      continue;
    }
    diag.push('🚫 '+tag+'：'+it.note+'，无法带上');
  }
  const kept=imgs.slice(0,2);
  if(imgs.length>2)diag.push('勾选画面共 '+imgs.length+' 张，接口上限 2 张（首尾帧），已取前 2 张；请只勾选最关键的两张');
  diag.push('结果：画面 '+kept.length+' 张、文字 '+texts.length+' 段（增减请回弹窗清单勾选）');
  return {imgs:kept,texts:texts.slice(0,3),diag};
}

  async function submitTask(){

    else{waitMsg('暂未提交成功（HTTP '+(res?res.status:'?')+'）：'+JSON.stringify(data||{}).slice(0,90)+'，持续重试…');}

  async function poll(vid){
    if(!waitCtl||waitCtl.cancelled)return;
    let pr=null,pd=null,nerr=null;
    try{
      pr=await fetch(pollBase+"/agnesapi?video_id="+vid+"&model_name=agnes-video-2.5-flash",{
        headers:{"Authorization":"Bearer "+API_KEY}
      });
      pd=await pr.json();
    }catch(e){nerr=e;}
    if(!waitCtl||waitCtl.cancelled)return;
    if(nerr||(pr&&!pr.ok)||(pd&&pd.error&&!pd.status&&!pd.state&&!pd.task_status)){
      const is429=(pr&&pr.status===429)||(pd&&pd.error&&(/429|频繁|too many/i.test(pd.error.code+' '+pd.error.message||'')));
      if(is429){pollDelay=Math.min(30000,pollDelay*2);}
      showRaw(pr?('HTTP '+pr.status+'\n'+JSON.stringify(pd||{})):(nerr&&nerr.message)||'未知网络错误');
      waitMsg((is429?'查询被限流(429)，已放慢到 '+Math.round(pollDelay/1000)+' 秒一查（任务已在生成中，不会重复提交）':'查询进度异常（'+(pr?'HTTP '+pr.status:'网络错误')+'），继续等待…')+' 任务号：'+vid);
      later(()=>poll(vid),pollDelay);
      return;
    }
    if(pollDelay!==5000){pollDelay=5000;} // 查询恢复正常节奏
    const st=String(pd.status||pd.state||pd.task_status||'').toLowerCase();
    const done=(st==='completed'||st==='success'||st==='succeeded'||st==='finished'||st==='done'||st.includes('complete')||st.includes('success'));
    const bad=(st==='failed'||st==='error'||st.includes('fail')||st.includes('cancel'));
    if(done){
      showRaw(JSON.stringify(pd).slice(0,2000));
      const url=extractResult(pd,'video');
      if(!url){
        endWait();
        alert('任务显示完成，但返回里没有视频地址。完整原始返回已显示在遮罩上，截图发我即可排查：\n'+JSON.stringify(pd).slice(0,500));
        return;
      }
      const c=getViewCenterPos();
      const tgt=pendingTarget&&nodes.includes(pendingTarget)?pendingTarget:null;
      pendingTarget=null;
      const n=tgt||{
        x:c.x-90,y:c.y-70,w:180,h:140,
        title:"AI生成视频",type:"video",isVideo:true,
        _objectUrl:null,videoEl:null,videoSnap:null,videoPlaying:false,src:url
      };
      if(tgt){
        destroyVideo(tgt);
        tgt.type='video';tgt.isVideo=true;
        tgt.text='';tgt.src=url;tgt.videoSnap=null;tgt._fitted=false;
        if(!tgt.title)tgt.title='AI生成视频';
      }
      n._objectUrl=url;
      const v=document.createElement('video');
      v.src=url;
      attachVideo(n,v);
      if(!tgt)nodes.push(n);
      setSelection([n]);
      saveProjects();
      draw();
      endWait();
      toast(tgt?'✅ 视频生成完成，已写回该卡片':'✅ 视频生成完成，已加入画布');
    }else if(bad){
      waitCtl.tries++;
      showRaw(JSON.stringify(pd).slice(0,2000));
      waitMsg('本轮生成失败：'+((pd.error&&pd.error.message)||JSON.stringify(pd).slice(0,100))+'，重新排队…');
      later(submitTask,RETRY_WAIT);
    }else{
      waitMsg('排队/生成中…（状态：'+(pd.status||pd.state||'?')+'，每 '+Math.round(pollDelay/1000)+' 秒查询一次）');
      later(()=>poll(vid),pollDelay);
    }
  }
  submitTask();
  closeAIModal();
}

// ---- 生成排队等待遮罩：无限重试直到出片 ----
let waitCtl=null;
function fmtMs(ms){
  const s=Math.floor(ms/1000);
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}
function beginWait(title){
  if(waitCtl&&!waitCtl.cancelled)return null;
  const ctl={cancelled:false,t0:Date.now(),tries:0,timer:null};
  waitCtl=ctl;
  const mask=document.getElementById('waitMask');
  mask.querySelector('.wait-title').innerText=title;
  mask.querySelector('.wait-msg').innerText='正在提交任务…';
  document.getElementById('waitRaw').style.display='none';
  mask.classList.add('show');
  ctl.timer=setInterval(()=>{
    document.getElementById('waitSub').innerText='已等待 '+fmtMs(Date.now()-ctl.t0)+' · 重试 '+ctl.tries+' 次';
  },1000);
  return ctl;
}
function waitSubTick(){
  if(!waitCtl)return;
  document.getElementById('waitSub').innerText='已等待 '+fmtMs(Date.now()-waitCtl.t0)+' · 重试 '+waitCtl.tries+' 次';
}
function waitMsg(msg){
  const el=document.getElementById('waitMsg');
  if(el)el.innerText=msg;
}
function endWait(){
  if(waitCtl&&waitCtl.timer)clearInterval(waitCtl.timer);
  waitCtl=null;
  document.getElementById('waitMask').classList.remove('show');
}
// 把接口原始返回显示在遮罩上，任何结构都能看到

// 宽容提取：不管返回字段叫什么，递归找出视频/图片地址（URL 或 base64）
function extractResult(obj,kind){
  const urls=[],b64s=[];
  (function walk(o,p){
    if(o==null)return;
    if(typeof o==='string'){
      if(/^https?:\/\//i.test(o))urls.push({p:p,u:o});
      else if(/(b64|base64)/i.test(p)&&o.length>64)b64s.push({p:p,v:o});
      return;
    }
    if(typeof o==='object'){for(const k of Object.keys(o))walk(o[k],p+'/'+k);}
  })(obj,'');
  if(kind==='video'){
    const m=urls.find(x=>/\.(mp4|mov|webm|m3u8)/i.test(x.u)||/video/i.test(x.p));
    if(m)return m.u;
    return null;
  }
  const m=urls.find(x=>/\.(png|jpe?g|webp|gif|bmp)/i.test(x.u))||urls.find(x=>/url/i.test(x.p));
  if(m)return m.u;
  const b=b64s[0];
  if(b){
    let v=b.v;
    if(v.startsWith('data:'))return v;
    if(v.startsWith('base64,'))return 'data:image/png;'+v;
    return 'data:image/png;base64,'+v;
  }
  return null;
}

// 连线端点：固定吸附到卡片左右两侧的端口圆点
function edgeAnchors(e){
  const A=e.a,B=e.b;
  const acx=A.x+A.w/2,bcx=B.x+B.w/2;
  const acy=A.y+A.h/2,bcy=B.y+B.h/2;
  const right=bcx>=acx;
  return {
    a:{x:right?A.x+A.w:A.x,y:acy},
    b:{x:right?B.x:B.x+B.w,y:bcy}
  };
}
// 三次贝塞尔控制点：从左右端口水平出入，正对时自动形成 S 弯
function edgeCurve(a,b){
  const dx=b.x-a.x;
  const dist=Math.hypot(dx,b.y-a.y)||1;
  const k=Math.min(180,Math.max(45,dist*0.45));
  const sx=Math.abs(dx)<1?1:Math.sign(dx);
  return {
    c1:{x:a.x+sx*k,y:a.y},
    c2:{x:b.x-sx*k,y:b.y}
  };
}
// 卡片左右两侧的小圆点：连线的引出接口
function drawPorts(n){
  const R=5,col='#7c3aed';
  [{x:n.x,y:n.y+n.h/2},{x:n.x+n.w,y:n.y+n.h/2}].forEach(p=>{
    const hot=portDrag&&portDrag.node===n&&Math.hypot(p.x-portDrag.pos.x,p.y-portDrag.pos.y)<2;
    ctx.beginPath();
    ctx.arc(p.x,p.y,hot?R+2.5:R,0,Math.PI*2);
    ctx.fillStyle=hot?'#a78bfa':col;
    ctx.fill();
    ctx.lineWidth=1.5/zoom;
    ctx.strokeStyle='#0a0b10';
    ctx.stroke();
  });
}
// 弯曲虚线，带流动动画（在相机变换下按世界坐标绘制）
function drawEdge(a,b,o){
  o=o||{};
  const c=edgeCurve(a,b);
  ctx.save();
  ctx.globalAlpha=o.alpha==null?1:o.alpha;
  ctx.strokeStyle=o.color||'#ffffff';
  ctx.lineWidth=(o.width||2)/zoom;
  ctx.lineCap='round';
  ctx.setLineDash([7/zoom,6/zoom]);
  ctx.lineDashOffset=(o.flow||0)/zoom;
  ctx.beginPath();
  ctx.moveTo(a.x,a.y);
  ctx.bezierCurveTo(c.c1.x,c.c1.y,c.c2.x,c.c2.y,b.x,b.y);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

// 卡片尺寸按素材宽高比自适应（面积大致恒定，以卡片中心为锚点）
function fitNodeByAspect(n,mw,mh){
  if(!mw||!mh)return;
  const ar=mw/mh;
  const A=180*140;
  const cx=n.x+n.w/2,cy=n.y+n.h/2;
  n.w=Math.max(90,Math.min(460,Math.round(Math.sqrt(A*ar))));
  n.h=Math.round(A/n.w);
  n.x=Math.round(cx-n.w/2);n.y=Math.round(cy-n.h/2);
  scheduleSave();
}
// 素材按 cover 方式铺满整张卡片：等比放大到盖住卡片，多余部分裁掉
function drawCover(el,n){
  const iw=el.videoWidth||el.naturalWidth||el.width;
  const ih=el.videoHeight||el.naturalHeight||el.height;
  if(!iw||!ih)return;
  const s=Math.max(n.w/iw,n.h/ih);
  try{ctx.drawImage(el,n.x+(n.w-iw*s)/2,n.y+(n.h-ih*s)/2,iw*s,ih*s);}catch(e){}
}
// 创建视频元素并挂上元数据回调，让卡片跟随视频真实宽高比
function attachVideo(n,v){
  v.muted=true;v.preload='auto';
  v.addEventListener('loadedmetadata',()=>{
    if(v.videoWidth)fitNodeByAspect(n,v.videoWidth,v.videoHeight);
    // 预加载停在元数据时 readyState 到不了 2，借一次极短播放强制解码首帧再暂停
    try{const pr=v.play();if(pr&&pr.catch)pr.catch(()=>{});}catch(e){}
    setTimeout(()=>{try{v.pause();}catch(e){}},150);
  });
  v.addEventListener('loadeddata',()=>{captureVideoSnap(n);});
  v.addEventListener('seeked',()=>{captureVideoSnap(n);});
  n.videoEl=v;
}
// 端口命中：世界坐标下找半径内最近的圆点
function portAt(m){
  const r=(isTouchDevice?16:9)/zoom;
  let best=null,bd=r;
  for(let i=nodes.length-1;i>=0;i--){
    const n=nodes[i];
    const pts=[{x:n.x,y:n.y+n.h/2},{x:n.x+n.w,y:n.y+n.h/2}];
    for(const p of pts){
      const d=Math.hypot(m.x-p.x,m.y-p.y);
      if(d<=bd){bd=d;best={node:n,pos:p};}
    }
  }
  return best;
}
function bezPoint(a,c1,c2,b,t){
  const u=1-t;
  return {
    x:u*u*u*a.x+3*u*u*t*c1.x+3*u*t*t*c2.x+t*t*t*b.x,
    y:u*u*u*a.y+3*u*u*t*c1.y+3*u*t*t*c2.y+t*t*t*b.y
  };
}
// 连线命中：沿贝塞尔曲线采样，判断点是否落在线上
function edgeNearPoint(m){
  const r=(isTouchDevice?12:6)/zoom;
  for(const e of edges){
    if(!e.a||!e.b)continue;
    const ap=edgeAnchors(e),c=edgeCurve(ap.a,ap.b);
    for(let t=0;t<=1.0001;t+=0.04){
      const p=bezPoint(ap.a,c.c1,c.c2,ap.b,t);
      if(Math.hypot(p.x-m.x,p.y-m.y)<=r)return e;
    }
  }
  return null;
}
function deleteEdge(e){
  edges=edges.filter(x=>x!==e);
  if(selectedEdge===e)selectedEdge=null;
  saveProjects();draw();
  toast('连线已删除');
}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#0a0b10';
  ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(camX,camY);
  ctx.scale(zoom,zoom);
  ctx.strokeStyle='#22283b';
  ctx.lineWidth=1/zoom;
  let gs=40;
  const sz=gs*zoom;
  if(sz<18){while(gs*zoom<18)gs*=5;}
  else if(sz>90){while(gs*zoom>90)gs/=5;}
  const vl=-camX/zoom, vt=-camY/zoom;
  const vr=(W-camX)/zoom, vb=(H-camY)/zoom;
  const x0=Math.floor(vl/gs)*gs, x1=Math.ceil(vr/gs)*gs;
  const y0=Math.floor(vt/gs)*gs, y1=Math.ceil(vb/gs)*gs;
  ctx.beginPath();
  for(let x=x0;x<=x1;x+=gs){ctx.moveTo(x,vt);ctx.lineTo(x,vb);}
  for(let y=y0;y<=y1;y+=gs){ctx.moveTo(vl,y);ctx.lineTo(vr,y);}
  ctx.stroke();
  const edgeFlow=(performance.now()/45)%13;
  edges.forEach(e=>{
    if(!e.a||!e.b)return;
    const ap=edgeAnchors(e);
    if(e===selectedEdge)drawEdge(ap.a,ap.b,{flow:-edgeFlow,color:'#f87171',width:3.5});
    else drawEdge(ap.a,ap.b,{flow:-edgeFlow,color:'#ffffff'});
  })
  nodes.forEach(n=>{
    ctx.fillStyle='#1c2030';
    roundRect(n.x,n.y,n.w,n.h,10);
    ctx.fill();
    const isSel=selectedNodes.has(n);
    let mediaEl=null;
    if(n.type==='img'&&n.src){
      if(!imgCache[n.src]){
        imgCache[n.src]=new Image();
        imgCache[n.src].src=n.src;
      }
      const im=imgCache[n.src];
      if(im.complete&&im.naturalWidth>0){
        if(!n._fitted){fitNodeByAspect(n,im.naturalWidth,im.naturalHeight);n._fitted=true;}
        mediaEl=im;
      }
    }else if(n.isVideo){
      mediaEl=(n.videoEl&&n.videoEl.readyState>=2)?n.videoEl:n.videoSnap;
    }
    if(mediaEl){
      ctx.save();
      roundRect(n.x,n.y,n.w,n.h,10);
      ctx.clip();
      drawCover(mediaEl,n);
      ctx.restore();
    }
    if((n.type==='audio'||n.type==='doc')&&n._fileId&&!mediaEl){
      ctx.fillStyle=n.type==='audio'?'#34d399':(n.type==='doc'?'#60a5fa':'#e2c98f');
      ctx.font='30px system-ui';
      ctx.fillText(kindIcon[n.type]||'📄',n.x+14,n.y+60);
      ctx.fillStyle='#9aa4bd';
      ctx.font='12px system-ui';
      const act=n.type==='audio'?' · 双击播放':(n.type==='doc'?' · 双击打开/下载':'');
      const meta=(n.fileSize?fmtSize(n.fileSize):'')+act;
      ctx.fillText(meta,n.x+14,n.y+84);
    }
    if(n.type==='text'&&n.text){
      ctx.fillStyle="#cdd5e1";
      ctx.font="12px system-ui";
      const t=n.text.slice(0,60)+(n.text.length>60?"...":"");
      ctx.fillText(t,n.x+10,n.y+44);
    }
    ctx.font='12px system-ui';
    const tw=ctx.measureText(n.title).width;
    ctx.fillStyle='rgba(10,11,16,.62)';
    roundRect(n.x+6,n.y+6,Math.min(tw+14,n.w-12),20,6);
    ctx.fill();
    ctx.fillStyle='#fff';
    ctx.fillText(n.title,n.x+13,n.y+20);
    ctx.strokeStyle=isSel?'#7c3aed':'#444b66';
    if(connectPendingNode===n)ctx.strokeStyle='#22c55e';
    ctx.lineWidth=(isSel?(lastSelected===n?3:2):2)/zoom;
    roundRect(n.x,n.y,n.w,n.h,10);
    ctx.stroke();
    if(marquee&&marquee.active&&marquee.hits&&marquee.hits.indexOf(n)>-1){
      ctx.strokeStyle='#a78bfa';
      ctx.lineWidth=2/zoom;
      ctx.setLineDash([6/zoom,4/zoom]);
      roundRect(n.x-4,n.y-4,n.w+8,n.h+8,12);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  })
  nodes.forEach(n=>drawPorts(n));
  if(portDrag){
    const tgt=hitNode({x:portDrag.mx,y:portDrag.my});
    const b=(tgt&&tgt!==portDrag.node)?edgeAnchors({a:portDrag.node,b:tgt}).b:{x:portDrag.mx,y:portDrag.my};
    if(tgt&&tgt!==portDrag.node){
      ctx.save();
      roundRect(tgt.x-3,tgt.y-3,tgt.w+6,tgt.h+6,12);
      ctx.strokeStyle='#22c55e';
      ctx.lineWidth=2.5/zoom;
      ctx.stroke();
      ctx.restore();
    }
    drawEdge(portDrag.pos,b,{alpha:.85,color:'#a78bfa'});
    ctx.save();
    ctx.beginPath();ctx.arc(b.x,b.y,5,0,Math.PI*2);
    ctx.fillStyle='#a78bfa';ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  if(marquee&&marquee.active){
    const x=Math.min(marquee.x0,marquee.x1);
    const y=Math.min(marquee.y0,marquee.y1);
    const w=Math.abs(marquee.x1-marquee.x0);
    const h=Math.abs(marquee.y1-marquee.y0);
    ctx.save();
    ctx.fillStyle='rgba(124,58,237,0.14)';
    ctx.fillRect(x,y,w,h);
    ctx.strokeStyle='#8b5cf6';
    ctx.lineWidth=1;
    ctx.setLineDash([5,4]);
    ctx.strokeRect(x+0.5,y+0.5,w,h);
    ctx.setLineDash([]);
    ctx.restore();
  }

  drawMinimap();

  if(connectPendingNode){
    ctx.save();
    ctx.fillStyle='rgba(34,197,94,.95)';
    ctx.font='13px system-ui';
    ctx.fillText('连线模式：已选起点「'+connectPendingNode.title+'」，点击或右键另一个节点完成连线（Esc 取消）',14,72);
    ctx.restore();
  }
}
// ---- 迷你导航图（左下角）----
function navRect(){
  let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;
  nodes.forEach(n=>{a=Math.min(a,n.x);b=Math.min(b,n.y);c=Math.max(c,n.x+n.w);d=Math.max(d,n.y+n.h);});
  if(!isFinite(a)){a=-400;b=-300;c=400;d=300;}
  const w=c-a||1,h=d-b||1;
  const m=Math.min(w,h)*0.12||60;
  a-=m;b-=m;c+=m;d+=m;
  const vl=-camX/zoom,vt=-camY/zoom,vr=(W-camX)/zoom,vb=(H-camY)/zoom;
  a=Math.min(a,vl);b=Math.min(b,vt);c=Math.max(c,vr);d=Math.max(d,vb);
  return {x0:a,y0:b,x1:c,y1:d};
}
function navDisp(){
  const nb=navRect();
  const maxW=180,maxH=124,pad=12;
  const s=Math.min(maxW/(nb.x1-nb.x0),maxH/(nb.y1-nb.y0));
  const w=(nb.x1-nb.x0)*s,h=(nb.y1-nb.y0)*s;
  const left=pad,top=H-pad-h-6;
  return {left,top,w,h,nb};
}
function drawMinimap(){
  const nd=navDisp(),nb=nd.nb;
  ctx.save();
  ctx.fillStyle='rgba(20,22,31,.88)';
  ctx.strokeStyle='#2d3348';
  ctx.lineWidth=1;
  roundRect(nd.left-6,nd.top-6,nd.w+12,nd.h+12,8);
  ctx.fill();ctx.stroke();
  const sx=v=>nd.left+(v-nb.x0)/(nb.x1-nb.x0)*nd.w;
  const sy=v=>nd.top+(v-nb.y0)/(nb.y1-nb.y0)*nd.h;
  ctx.fillStyle='#444b66';
  nodes.forEach(n=>{
    ctx.fillRect(sx(n.x),sy(n.y),
      Math.max(2,sx(n.x+n.w)-sx(n.x)),
      Math.max(2,sy(n.y+n.h)-sy(n.y)));
  });
  ctx.strokeStyle='#7c3aed';
  ctx.lineWidth=1.5;
  ctx.strokeRect(sx(-camX/zoom),sy(-camY/zoom),
    (W/zoom)/(nb.x1-nb.x0)*nd.w,(H/zoom)/(nb.y1-nb.y0)*nd.h);
  ctx.restore();
}
function navHit(px,py){
  const nd=navDisp();
  return px>=nd.left-6&&px<=nd.left+nd.w+6&&py>=nd.top-6&&py<=nd.top+nd.h+6;
}
function navSetView(px,py){
  const nd=navDisp(),nb=nd.nb;
  const wx=nb.x0+(px-nd.left)/nd.w*(nb.x1-nb.x0);
  const wy=nb.y0+(py-nd.top)/nd.h*(nb.y1-nb.y0);
  camX=W/2-wx*zoom;
  camY=H/2-wy*zoom;
}
function startLoop(){
  if(rafId)return;
  const loop=()=>{draw();rafId=requestAnimationFrame(loop);};
  rafId=requestAnimationFrame(loop);
}

cv.addEventListener('contextmenu',e=>{
  e.preventDefault();
  const m=world(e.offsetX,e.offsetY);
  const hit=hitNode(m);
  const ce=hit?null:edgeNearPoint(m);
  if(hit&&!selectedNodes.has(hit))setSelection([hit]);
  ctxTarget={type:hit?'node':(ce?'edge':'canvas'),node:hit,edge:ce,worldPos:m};
  openCtxMenu(e.clientX,e.clientY);
  draw();
});

cv.addEventListener('mousedown',e=>{
  closeCtxMenu();
  const sp={x:e.offsetX,y:e.offsetY};
  const m=world(sp.x,sp.y);
  if(e.button===1||(e.button===0&&spaceDown)){
    e.preventDefault();
    panStart={mouseX:sp.x,mouseY:sp.y,oldCamX:camX,oldCamY:camY};
    cv.style.cursor='grabbing';
    return;
  }
  if(e.button!==0)return;
  if(navHit(sp.x,sp.y)){
    navDown=true;
    navSetView(sp.x,sp.y);
    draw();
    return;
  }
  const port=portAt(m);
  if(port){
    portDrag={node:port.node,pos:port.pos,mx:m.x,my:m.y};
    draw();
    return;
  }
  const hit=hitNode(m);
  if(hit){
    if(e.shiftKey&&selectedNodes.has(hit)){
      selectedNodes.delete(hit);
      const rest=[...selectedNodes];
      lastSelected=rest.length?rest[rest.length-1]:null;
      selected=lastSelected;
      draw();
      return;
    }
    if(!selectedNodes.has(hit))setSelection([hit],e.shiftKey);
    else{lastSelected=hit;selected=hit;}
    dragN=hit;
    dragNodes=[...selectedNodes].map(n=>({n,ox:n.x,oy:n.y}));
    pressInfo={x:sp.x,y:sp.y,world:m,moved:false};
    cv.style.cursor='move';
    draw();
    return;
  }
  marquee={x0:sp.x,y0:sp.y,x1:sp.x,y1:sp.y,additive:e.shiftKey,active:false,hits:[]};
  if(!e.shiftKey)setSelection([]);
  pressInfo={x:sp.x,y:sp.y,world:m,moved:false};
  draw();
});

cv.addEventListener('mousemove',e=>{
  const sp={x:e.offsetX,y:e.offsetY};
  const m=world(sp.x,sp.y);
  if(navDown){navSetView(sp.x,sp.y);return;}
  if(portDrag){portDrag.mx=m.x;portDrag.my=m.y;return;}
  if(dragNodes&&pressInfo){
    if(!pressInfo.moved&&Math.hypot(sp.x-pressInfo.x,sp.y-pressInfo.y)>3)pressInfo.moved=true;
    if(pressInfo.moved){
      const dx=m.x-pressInfo.world.x,dy=m.y-pressInfo.world.y;
      dragNodes.forEach(d=>{d.n.x=d.ox+dx;d.n.y=d.oy+dy;});
      scheduleSave();
    }
    return;
  }
  if(panStart){
    camX=panStart.oldCamX+(sp.x-panStart.mouseX);
    camY=panStart.oldCamY+(sp.y-panStart.mouseY);
    return;
  }
  if(marquee){
    marquee.x1=sp.x;
    marquee.y1=sp.y;
    if(!marquee.active&&Math.hypot(sp.x-marquee.x0,sp.y-marquee.y0)>3)marquee.active=true;
    if(marquee.active){
      const a=world(Math.min(marquee.x0,marquee.x1),Math.min(marquee.y0,marquee.y1));
      const b=world(Math.max(marquee.x0,marquee.x1),Math.max(marquee.y0,marquee.y1));
      const box={x:a.x,y:a.y,w:b.x-a.x,h:b.y-a.y};
      marquee.hits=nodes.filter(n=>rectsIntersect(n,box));
    }
    return;
  }
  if(navHit(sp.x,sp.y)){cv.style.cursor='pointer';return;}
  cv.style.cursor=portAt(m)?'grab':'crosshair';
});

window.addEventListener('mouseup',e=>{
  if(navDown){
    navDown=false;
    saveProjects();
    return;
  }
  if(portDrag){
    const rect=cv.getBoundingClientRect();
    const m=world(e.clientX-rect.left,e.clientY-rect.top);
    const tgt=hitNode(m);
    const from=portDrag.node;
    portDrag=null;
    if(tgt&&tgt!==from){
      const dup=edges.some(ed=>(ed.a===from&&ed.b===tgt)||(ed.a===tgt&&ed.b===from));
      if(dup)toast('这两个节点之间已有连线');
      else{edges.push({a:from,b:tgt});saveProjects();toast('连线完成');}
    }
    draw();
    return;
  }
  if(dragNodes){
    if(pressInfo&&pressInfo.moved)saveProjects();
    dragNodes=null;dragN=null;pressInfo=null;
    cv.style.cursor=spaceDown?'grab':'crosshair';
    return;
  }
  if(panStart){
    panStart=null;
    cv.style.cursor=spaceDown?'grab':'crosshair';
    return;
  }
  if(marquee){
    const mq=marquee;
    marquee=null;
    if(mq.active){
      const a=world(Math.min(mq.x0,mq.x1),Math.min(mq.y0,mq.y1));
      const b=world(Math.max(mq.x0,mq.x1),Math.max(mq.y0,mq.y1));
      const box={x:a.x,y:a.y,w:b.x-a.x,h:b.y-a.y};
      const hits=nodes.filter(n=>rectsIntersect(n,box));
      if(hits.length)setSelection(hits,mq.additive);
      else if(!mq.additive)setSelection([]);
      if(hits.length)toast('框选了 '+selectedNodes.size+' 个节点');
    }else if(!mq.additive){
      const mqm=world(mq.x0,mq.y0);
      const ce=edgeNearPoint(mqm);
      if(ce){selectedEdge=ce;selectedNodes.clear();selected=null;lastSelected=null;toast('已选中连线，按 Delete 键或右键可删除');}
      else{selectedEdge=null;setSelection([]);}
    }
    pressInfo=null;
    draw();
  }
});

function playAudioNode(n){
  if(!n.src)return toast('音频文件已失效（blob 仅本次会话有效）');
  if(!n.audioEl)n.audioEl=new Audio(n.src);
  if(n.audioEl.paused){
    n.audioEl.currentTime=0;
    n.audioEl.play().catch(()=>toast('手机浏览器需先点一下页面再播'));
    toast('▶ 播放中：'+n.title);
  }else{
    n.audioEl.pause();
    toast('⏸ 已暂停');
  }
}
cv.addEventListener('dblclick',e=>{
  if(navHit(e.offsetX,e.offsetY))return;
  const m=world(e.offsetX,e.offsetY);
  const hit=hitNode(m);
  if(hit){
    if(hit.type==='audio'){playAudioNode(hit);return;}
    if(hit.type==='doc'){openDocNode(hit);return;}
    openAIModal(hit);return;
  }
  addNodeAt(m);
});

cv.addEventListener('wheel',e=>{
  e.preventDefault();
  zoomAt(e.deltaY<0?1.1:1/1.1,e.offsetX,e.offsetY);
},{passive:false});

// ---- 移动端触控支持 ----
let ts=null;
let tsLongTimer=null;
let lastTapTime=0,lastTapX=0,lastTapY=0,lastTapNode=null;
function tSp(e){
  const r=cv.getBoundingClientRect();
  const t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0]);
  return {x:t.clientX-r.left,y:t.clientY-r.top,cx:t.clientX,cy:t.clientY};
}
function tsCancel(){
  clearTimeout(tsLongTimer);
  if(!ts)return;
  if(ts.mode==='drag'){dragNodes=null;dragN=null;pressInfo=null;}
  if(ts.mode==='port')portDrag=null;
  if(ts.mode==='pan')panStart=null;
  ts=null;
}
function ctxAtPoint(sp,cx,cy){
  const m=world(sp.x,sp.y);
  const hit=hitNode(m);
  const ce=hit?null:edgeNearPoint(m);
  if(hit&&!selectedNodes.has(hit))setSelection([hit]);
  ctxTarget={type:hit?'node':(ce?'edge':'canvas'),node:hit,edge:ce,worldPos:m};
  openCtxMenu(cx,cy);
  if(navigator.vibrate)navigator.vibrate(15);
}
cv.addEventListener('touchstart',e=>{
  e.preventDefault();
  closeCtxMenu();
  clearTimeout(tsLongTimer);
  if(e.touches.length===2){
    tsCancel();
    const r=cv.getBoundingClientRect();
    const a=e.touches[0],b=e.touches[1];
    const p0={x:a.clientX-r.left,y:a.clientY-r.top};
    const p1={x:b.clientX-r.left,y:b.clientY-r.top};
    const mid={x:(p0.x+p1.x)/2,y:(p0.y+p1.y)/2};
    ts={mode:'pinch',d0:Math.max(10,Math.hypot(p1.x-p0.x,p1.y-p0.y)),zoom0:zoom,
        wmid:{x:(mid.x-camX)/zoom,y:(mid.y-camY)/zoom},moved:true};
    return;
  }
  if(e.touches.length>2){tsCancel();return;}
  const sp=tSp(e);
  const m=world(sp.x,sp.y);
  ts={mode:'',x0:sp.x,y0:sp.y,moved:false,longFired:false};
  if(navHit(sp.x,sp.y)){
    ts.mode='nav';
    navSetView(sp.x,sp.y);
    return;
  }
  const port=portAt(m);
  if(port){
    ts.mode='port';
    portDrag={node:port.node,pos:port.pos,mx:m.x,my:m.y};
    return;
  }
  const hit=hitNode(m);
  if(hit){
    ts.mode='drag';
    ts.node=hit;
    setSelection([hit]);
    dragN=hit;
    dragNodes=[...selectedNodes].map(n=>({n,ox:n.x,oy:n.y}));
    pressInfo={x:sp.x,y:sp.y,world:m,moved:false};
  }else{
    ts.mode='pan';
    panStart={mouseX:sp.x,mouseY:sp.y,oldCamX:camX,oldCamY:camY};
  }
  // 长按 0.52 秒：等效桌面右键
  tsLongTimer=setTimeout(()=>{
    if(ts&&!ts.moved&&!ts.longFired){
      ts.longFired=true;
      ctxAtPoint(sp,sp.cx,sp.cy);
    }
  },520);
},{passive:false});
cv.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(!ts)return;
  if(ts.mode==='pinch'){
    if(e.touches.length<2)return;
    const r=cv.getBoundingClientRect();
    const a=e.touches[0],b=e.touches[1];
    const p0={x:a.clientX-r.left,y:a.clientY-r.top};
    const p1={x:b.clientX-r.left,y:b.clientY-r.top};
    const mid={x:(p0.x+p1.x)/2,y:(p0.y+p1.y)/2};
    const d=Math.max(10,Math.hypot(p1.x-p0.x,p1.y-p0.y));
    zoom=Math.min(20,Math.max(0.01,ts.zoom0*(d/ts.d0)));
    camX=mid.x-ts.wmid.x*zoom;
    camY=mid.y-ts.wmid.y*zoom;
    updateZoomText();
    return;
  }
  const sp=tSp(e);
  if(!ts.moved&&Math.hypot(sp.x-ts.x0,sp.y-ts.y0)>8){
    ts.moved=true;
    clearTimeout(tsLongTimer);
  }
  if(!ts.moved)return;
  const m=world(sp.x,sp.y);
  if(ts.mode==='nav'){navSetView(sp.x,sp.y);return;}
  if(ts.mode==='port'){portDrag.mx=m.x;portDrag.my=m.y;return;}
  if(ts.mode==='drag'){
    if(pressInfo&&!pressInfo.moved)pressInfo.moved=true;
    if(pressInfo&&pressInfo.moved){
      const dx=m.x-pressInfo.world.x,dy=m.y-pressInfo.world.y;
      dragNodes.forEach(dd=>{dd.n.x=dd.ox+dx;dd.n.y=dd.oy+dy;});
      scheduleSave();
    }
    return;
  }
  if(ts.mode==='pan'&&panStart){
    camX=panStart.oldCamX+(sp.x-panStart.mouseX);
    camY=panStart.oldCamY+(sp.y-panStart.mouseY);
  }
},{passive:false});
function tsFinish(e){
  e.preventDefault();
  clearTimeout(tsLongTimer);
  if(!ts)return;
  // 捏合抬起一指：剩下手指转为平移，避免跳变
  if(e.touches.length>=1){
    if(ts.mode==='pinch'){
      const r=cv.getBoundingClientRect();
      const t0=e.touches[0];
      const p={x:t0.clientX-r.left,y:t0.clientY-r.top};
      ts={mode:'pan',x0:p.x,y0:p.y,moved:true,longFired:true};
      panStart={mouseX:p.x,mouseY:p.y,oldCamX:camX,oldCamY:camY};
    }
    return;
  }
  const sp=tSp(e);
  const m=world(sp.x,sp.y);
  if(ts.mode==='nav'){
    saveProjects();
  }else if(ts.mode==='port'){
    const tgt=hitNode(m);
    const from=portDrag?portDrag.node:null;
    portDrag=null;
    if(tgt&&from&&tgt!==from){
      const dup=edges.some(ed=>(ed.a===from&&ed.b===tgt)||(ed.a===tgt&&ed.b===from));
      if(dup)toast('这两个节点之间已有连线');
      else{edges.push({a:from,b:tgt});saveProjects();toast('连线完成');}
    }
  }else if(ts.mode==='drag'){
    if(pressInfo&&pressInfo.moved)saveProjects();
    else if(!ts.moved&&!ts.longFired){
      const now=Date.now();
      const tNode=ts.node;
      if(tNode&&(tNode.type==='audio'||tNode.type==='doc')&&now-lastTapTime<400&&lastTapNode===tNode){
        if(tNode.type==='audio')playAudioNode(tNode);else openDocNode(tNode);
        lastTapTime=0;lastTapNode=null;
      }else{
        lastTapTime=now;lastTapNode=tNode;
        toast('已选中节点，长按打开操作菜单');
      }
    }
    dragNodes=null;dragN=null;pressInfo=null;
  }else if(ts.mode==='pan'){
    panStart=null;
    if(!ts.moved&&!ts.longFired){
      const now=Date.now();
      if(now-lastTapTime<350&&Math.hypot(sp.x-lastTapX,sp.y-lastTapY)<30){
        lastTapTime=0;
        addNodeAt(m);
      }else{
        lastTapTime=now;lastTapX=sp.x;lastTapY=sp.y;
        const ce=edgeNearPoint(m);
        if(ce){selectedEdge=ce;setSelection([]);toast('已选中连线，长按可删除');}
        else{selectedEdge=null;setSelection([]);}
      }
    }
  }
  ts=null;
  draw();
}
cv.addEventListener('touchend',tsFinish,{passive:false});
cv.addEventListener('touchcancel',tsCancel,{passive:false});

function isTypingTarget(t){
  return t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable);
}
window.addEventListener('keydown',e=>{
  if(e.code==='Space'&&!isTypingTarget(e.target)){
    if(!spaceDown){spaceDown=true;cv.style.cursor='grab';}
    e.preventDefault();
    return;
  }
  if(isTypingTarget(e.target))return;
  const k=e.key.toLowerCase();
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&k==='a'){e.preventDefault();selectAll();}
  else if(mod&&k==='c'){e.preventDefault();copySelection();}
  else if(mod&&k==='v'){e.preventDefault();pasteClipboard();}
  else if(mod&&k==='d'){e.preventDefault();duplicateSelection();}
  else if(e.key==='Delete'||e.key==='Backspace'){
    if(selectedEdge){e.preventDefault();deleteEdge(selectedEdge);}
    else if(selectedNodes.size){e.preventDefault();delSel();}
  }
  else if(e.key==='Escape'){
    closeCtxMenu();
    if(document.getElementById('recoverModal').style.display==='flex'){closeRecoverModal();return;}
    portDrag=null;
    if(connectPendingNode){connectPendingNode=null;toast('已取消连线起点');}
    else if(selectedEdge){selectedEdge=null;}
    else if(selectedNodes.size)setSelection([]);
    draw();
  }
});
window.addEventListener('keyup',e=>{
  if(e.code==='Space'){
    spaceDown=false;
    if(!panStart)cv.style.cursor='crosshair';
  }
});

function syncCanvasSize(){
  const vv=window.visualViewport;
  W=cv.width=Math.round(vv?vv.width:innerWidth);
  H=cv.height=Math.round(vv?vv.height:innerHeight);
}
addEventListener('resize',()=>{syncCanvasSize();draw();});
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',()=>{syncCanvasSize();draw();});
  window.visualViewport.addEventListener('scroll',()=>{syncCanvasSize();draw();});
}

(async function init(){
  refreshTopBar();
  updateZoomText();
  applySettings();
  const sh=await ensureSyncPerm(true);
  if(sh)applySettings();
  const last=localStorage.getItem('pavo_last');
  const projs=loadProjects();
  if(last&&projs[last])loadProject(last);
  else newProject();
  openRecoverModal();
  startLoop();
})();
</script>
