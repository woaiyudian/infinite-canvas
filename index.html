<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pavo分镜画布-右键菜单+框选版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{overflow:hidden;background:#0a0b10;color:#fff;height:100vh;height:100dvh;overscroll-behavior:none}
#cv{display:block;cursor:crosshair;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.top-bar{position:fixed;top:0;left:0;right:0;height:48px;background:#14161f;border-bottom:1px solid #252a3d;display:flex;align-items:center;padding:0 16px;gap:10px;z-index:20;overflow-x:auto}
.top-bar .proj-item{display:flex;align-items:center;gap:6px;padding:6px 12px;background:#1c2030;border-radius:8px;cursor:pointer;font-size:13px;white-space:nowrap}
.top-bar .proj-item.active{background:#7c3aed}
.top-bar .del-proj{color:#ef4444;cursor:pointer;font-size:14px;user-select:none}
.toolbar{position:fixed;left:12px;top:64px;display:flex;flex-direction:column;gap:8px;background:#1c2030;padding:10px;border-radius:12px;border:1px solid #2d3348;z-index:10}
.tool-btn{width:40px;height:40px;border:none;background:#2d3348;color:#fff;border-radius:8px;font-size:18px;cursor:pointer}
.tool-btn:hover{background:#3d4358}
.zoom-bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:#1c2030;padding:6px 12px;border-radius:20px;border:1px solid #2d3348;z-index:10}
.zoom-bar button{width:28px;height:28px;border:none;background:#2d3348;color:#fff;border-radius:6px;cursor:pointer}
#zoomLabel{font-size:13px;min-width:40px;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:none;align-items:center;justify-content:center;z-index:100}
.modal-content{background:#1c2030;padding:24px;border-radius:12px;width:460px;border:1px solid #2d3348}
.modal-content h3{margin-bottom:16px;font-size:16px}
.form-row{display:flex;gap:10px;margin:10px 0;align-items:center}
.form-row label{font-size:13px;width:80px;flex-shrink:0}
.modal-content input,.modal-content textarea,.modal-content select{flex:1;padding:8px;border-radius:6px;border:1px solid #2d3348;background:#0a0b10;color:#fff;font-size:13px}
.modal-content textarea{min-height:80px;resize:vertical}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.btn-primary{background:#7c3aed;color:#fff;padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:13px}
.btn-secondary{background:#2d3348;color:#fff;padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:13px}
.edit-modal{position:fixed;z-index:120;background:#1c2030;padding:20px;border-radius:12px;border:1px solid #444;display:none;width:400px}
.edit-modal label{display:block;margin:8px 0 4px}
.edit-modal input,.edit-modal textarea{width:100%;padding:8px;border-radius:6px;border:1px solid #2d3348;background:#0a0b10;color:#fff;font-size:13px}
.edit-modal textarea{min-height:100px;resize:vertical}
.ctx-menu{position:fixed;z-index:200;min-width:212px;background:#191d2b;border:1px solid #2f3550;border-radius:10px;padding:6px;display:none;box-shadow:0 12px 34px rgba(0,0,0,.6);font-size:13px;user-select:none}
.ctx-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;color:#dfe4f0;white-space:nowrap}
.ctx-item:hover{background:#7c3aed;color:#fff}
.ctx-item.danger{color:#ff7b7b}
.ctx-item.danger:hover{background:#dc2626;color:#fff}
.ctx-item.disabled{opacity:.35;cursor:not-allowed}
.ctx-item.disabled:hover{background:transparent;color:#dfe4f0}
.ctx-ico{width:16px;text-align:center;flex-shrink:0;font-size:13px}
.ctx-label{flex:1}
.ctx-hint{font-size:11px;color:#8892ab;margin-left:18px}
.ctx-item:hover .ctx-hint{color:#f3e8ff}
.ctx-sep{height:1px;background:#2a3046;margin:5px 8px}
.ctx-title{padding:5px 10px 7px;font-size:11px;color:#7f8aa3;letter-spacing:.4px}
#toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(10px);background:#1c2030;border:1px solid #3d4358;color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:300}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hint-bar{position:fixed;right:12px;bottom:16px;font-size:11px;color:#6b7488;background:rgba(20,22,31,.85);padding:7px 11px;border-radius:8px;border:1px solid #252a3d;z-index:10;line-height:1.7}
.hint-bar b{color:#9aa4bd;font-weight:500}
.wait-mask{position:fixed;inset:0;background:rgba(5,6,10,.72);display:none;align-items:center;justify-content:center;z-index:400}
.wait-mask.show{display:flex}
.wait-box{background:#1c2030;border:1px solid #3d4358;border-radius:14px;padding:24px 28px;width:380px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.6)}
.wait-spin{width:46px;height:46px;margin:0 auto 14px;border:4px solid #3d4358;border-top-color:#7c3aed;border-radius:50%;animation:wa-spin 1s linear infinite}
@keyframes wa-spin{to{transform:rotate(360deg)}}
.wait-title{font-size:15px;margin-bottom:6px}
.wait-msg{font-size:13px;color:#c3cbdc;min-height:20px;line-height:1.6}
.wait-sub{font-size:12px;color:#8892ab;margin:8px 0 16px}
.wait-cancel{background:#2d3348;color:#ffd7d7;border:1px solid #4a3550;padding:7px 18px;border-radius:6px;cursor:pointer;font-size:13px}
.wait-cancel:hover{background:#dc2626;color:#fff}
.wait-warn{font-size:12px;color:#fbbf24;margin:2px 0 14px}
@media (max-width:640px),(pointer:coarse){
  .modal-content{width:calc(100vw - 20px);max-height:calc(100dvh - 40px);overflow-y:auto}
  .edit-modal{left:10px!important}
  .toolbar{top:56px;padding:6px;gap:6px}
  .tool-btn{width:40px;height:40px;font-size:17px}
  .zoom-bar{bottom:10px;padding:4px 8px}
  .zoom-bar button{width:34px;height:34px}
  .hint-bar{display:none}
  .top-bar{padding:0 8px}
  .ctx-menu{min-width:186px;font-size:14px}
  .ctx-item{padding:10px 12px}
}
</style>
</head>
<body>
<div class="top-bar" id="topBar"></div>
<canvas id="cv"></canvas>
<div class="toolbar">
  <button class="tool-btn" onclick="addNode()" title="新增节点">+</button>
  <button class="tool-btn" onclick="openAIModal()" title="AI生成">✨</button>
  <button class="tool-btn" onclick="chainSelected()" title="连接两个节点【先点第一个节点，点这个按钮，再点第二个】">🔗</button>
  <button class="tool-btn" onclick="selectAll()" title="全选所有节点">▣</button>
  <button class="tool-btn" onclick="delSel()" title="删除选中">🗑</button>
  <button class="tool-btn" onclick="uploadAsset()" title="上传图片/视频素材">🖼</button>
  <button class="tool-btn" onclick="exportPNG()" title="导出画布截图">📸</button>
  <button class="tool-btn" onclick="exportJSON()" title="导出项目文件">💾</button>
  <button class="tool-btn" onclick="importJSON()" title="导入项目文件">📂</button>
</div>
<div class="zoom-bar">
  <button onclick="zoomOut()">-</button>
  <span id="zoomLabel">100%</span>
  <button onclick="zoomIn()">+</button>
  <button onclick="fitContent()" title="定位到全部内容">⛶</button>
</div>
<div class="hint-bar">
  <div><b>左键拖拽</b> 框选 · <b>Shift</b> 追加</div>
  <div><b>中键</b> 或 <b>空格+左键</b> 平移</div>
  <div><b>右键</b> 菜单 · <b>滚轮</b> 缩放</div>
  <div><b>拖拽圆点</b> 连线 · <b>单击连线</b> 选中</div>
  <div><b>Delete</b> 删除选中连线 · <b>Esc</b> 取消</div>
  <div><b>左下角导航图</b> 点击/拖拽瞬移 · <b>⛶</b> 定位全部内容</div>
</div>
<div class="modal" id="aiModal">
  <div class="modal-content">
    <h3>AI生成分镜</h3>
    <div class="form-row">
      <label>类型</label>
      <select id="aiType" onchange="aiTypeChange()">
        <option value="video">视频</option>
        <option value="image">图片</option>
        <option value="text">文本脚本</option>
      </select>
    </div>
    <div class="form-row">
      <label>提示词</label>
      <textarea id="aiPrompt" placeholder="描述画面"></textarea>
    </div>
    <div class="form-row">
      <label>参考素材</label>
      <button class="btn-secondary" onclick="uploadAIRef()" style="flex:1">📎 上传参考图/参考视频</button>
    </div>
    <div id="aiRefTip" style="font-size:12px;color:#94a3b8;margin:4px 0 8px 80px"></div>
    <div class="form-row">
      <label>画布参考</label>
      <select id="aiRefNode"><option value="">不选画布节点</option></select>
    </div>
    <div class="form-row" id="ratioRow">
      <label>画面比例</label>
      <select id="aiRatio">
        <option value="16:9">16:9 横屏</option>
        <option value="9:16">9:16 竖屏短剧</option>
        <option value="1:1">1:1 正方形</option>
      </select>
    </div>
    <div class="form-row" id="kRow">
      <label>清晰度</label>
      <select id="aiK">
        <option value="1">1K</option>
        <option value="2">2K</option>
        <option value="4">4K</option>
      </select>
    </div>
    <div class="form-row" id="durationRow">
      <label>视频时长</label>
      <input type="number" id="aiDuration" value="5" min="4" max="12">
    </div>
    <div class="form-row" id="seedRow">
      <label>随机种子</label>
      <input type="number" id="aiSeed" value="-1">
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeAIModal()">取消</button>
      <button class="btn-primary" onclick="runAI()">开始生成</button>
    </div>
  </div>
</div>

<div class="edit-modal" id="editModal">
  <label>节点标题</label>
  <input type="text" id="editTitle" style="width:100%">
  <label>文本内容</label>
  <textarea id="editText"></textarea>
  <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end">
    <button class="btn-secondary" onclick="closeEditModal()">取消</button>
    <button class="btn-primary" onclick="saveEdit()">保存</button>
  </div>
</div>

<div class="ctx-menu" id="ctxMenu"></div>
<div id="toast"></div>
<div class="wait-mask" id="waitMask">
  <div class="wait-box">
    <div class="wait-spin"></div>
    <div class="wait-title">视频生成排队中</div>
    <div class="wait-msg" id="waitMsg">正在提交任务…</div>
    <div class="wait-sub" id="waitSub">已等待 00:00</div>
    <div class="wait-warn">⚠ 生成期间请不要关闭或刷新页面</div>
    <button class="wait-cancel" onclick="cancelWait()">取消任务</button>
  </div>
</div>

<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const isTouchDevice=('ontouchstart' in window)||navigator.maxTouchPoints>0;
let W=cv.width=innerWidth,H=cv.height=innerHeight;
let camX=0,camY=0,zoom=1;
let nodes=[],edges=[];
let selected=null;
let selectedNodes=new Set();
let lastSelected=null;
const imgCache={};
let dragN=null;
let dragNodes=null;
let pressInfo=null;
let panStart=null;
let marquee=null;
let spaceDown=false;
let clipboard=[];
let ctxTarget=null;
let currentProjectId=null;
let activeVideoNode=null;
let rafId=null;
let connectPendingNode=null;
let portDrag=null;
let navDown=false;
let selectedEdge=null;
let editTargetNode=null;
const API_BASE='https://api.agnes-ai.cn/v1';
const API_KEY='sk-pVsYipjj0gZgzf9xionpcneAekuTyWEpr5G7RAwbBOcRrhr1';
let refImageBlob=null;
let refVideoBlob=null;

function world(x,y){return {x:(x-camX)/zoom,y:(y-camY)/zoom}}
function screen(x,y){return {x:x*zoom+camX,y:y*zoom+camY}}
function getViewCenterPos(){return world(W/2,H/2)}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
let toastTimer=null;
function toast(msg){
  const el=document.getElementById('toast');
  el.innerText=msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),1600);
}
function blobToBase64(blob){
  return new Promise(resolve=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result);
    r.readAsDataURL(blob);
  })
}

function setSelection(arr,additive){
  const list=(arr||[]).filter(Boolean);
  if(!additive)selectedNodes.clear();
  list.forEach(n=>selectedNodes.add(n));
  const all=[...selectedNodes];
  lastSelected=list.length?list[list.length-1]:(all.length?all[all.length-1]:null);
  selected=lastSelected;
}
function hitNode(m){
  for(let i=nodes.length-1;i>=0;i--){
    const n=nodes[i];
    if(m.x>n.x&&m.x<n.x+n.w&&m.y>n.y&&m.y<n.y+n.h)return n;
  }
  return null;
}
function rectsIntersect(a,b){
  return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
}
function selectAll(){
  if(!nodes.length)return toast('画布上还没有节点');
  setSelection(nodes);
  toast('已全选 '+nodes.length+' 个节点');
  draw();
}

function sleepVideo(node){
  if(!node.isVideo||!node.videoEl)return;
  captureVideoSnap(node);
  node.videoEl.pause();
  node.videoEl.src='';
  node.videoPlaying=false;
  if(activeVideoNode===node)activeVideoNode=null;
}
function wakeVideo(node){
  if(!node.isVideo||!node._objectUrl)return;
  ensureVideoEl(node);
  if(!node.videoEl)return;
  node.videoEl.src=node._objectUrl;
  node.videoPlaying=true;
  activeVideoNode=node;
}
function captureVideoSnap(node){
  if(!node.videoEl)return;
  const v=node.videoEl;
  if(v.readyState<2)return;
  const c=document.createElement('canvas');
  c.width=v.videoWidth;
  c.height=v.videoHeight;
  const cc=c.getContext('2d');
  try{cc.drawImage(v,0,0);node.videoSnap=c;}catch(e){}
}
function ensureVideoEl(n){
  if(n.isVideo&&n._objectUrl&&(!n.videoEl||typeof n.videoEl.pause!=='function')){
    const v=document.createElement('video');
    v.src=n._objectUrl;
    attachVideo(n,v);
  }
}
function destroyVideo(node){
  try{
    if(node.videoEl&&typeof node.videoEl.pause==='function')sleepVideo(node);
  }catch(e){}
  if(node._objectUrl){try{URL.revokeObjectURL(node._objectUrl);}catch(e){}}
  node.videoEl=null;node.videoSnap=null;node.videoPlaying=false;
}
function serializeEdges(){
  return edges.map(e=>({a:nodes.indexOf(e.a),b:nodes.indexOf(e.b)})).filter(e=>e.a>=0&&e.b>=0);
}
function deserializeEdges(list,nodesArr){
  return (list||[]).map(e=>{
    if(!e)return null;
    if(typeof e.a==='number'&&typeof e.b==='number')return {a:nodesArr[e.a],b:nodesArr[e.b]};
    if(e.a&&e.b){
      const fa=nodesArr.find(n=>n.x===e.a.x&&n.y===e.a.y&&n.title===e.a.title);
      const fb=nodesArr.find(n=>n.x===e.b.x&&n.y===e.b.y&&n.title===e.b.title);
      if(fa&&fb)return {a:fa,b:fb};
    }
    return null;
  }).filter(e=>e&&e.a&&e.b);
}
function loadProjects(){
  try{return JSON.parse(localStorage.getItem('pavo_projects')||'{}')}catch{return {}}
}
function saveProjects(){
  const p=loadProjects();
  p[currentProjectId]={nodes,edges:serializeEdges(),camX,camY,zoom};
  try{localStorage.setItem('pavo_projects',JSON.stringify(p));}catch(e){}
}
let saveTimer=null;
function scheduleSave(){
  if(saveTimer)return;
  saveTimer=setTimeout(()=>{saveTimer=null;saveProjects();},400);
}
function loadProject(id){
  nodes.forEach(n=>destroyVideo(n));
  activeVideoNode=null;
  connectPendingNode=null;
  setSelection([]);
  const p=loadProjects();
  const d=p[id]||{nodes:[],edges:[],camX:0,camY:0,zoom:1};
  nodes=d.nodes||[];
  nodes.forEach(n=>{
    n.videoEl=null;n.videoSnap=null;n.videoPlaying=false;
    ensureVideoEl(n);
  });
  edges=deserializeEdges(d.edges,nodes);
  selectedEdge=null;portDrag=null;
  camX=d.camX||0;camY=d.camY||0;zoom=d.zoom||1;
  currentProjectId=id;
  localStorage.setItem('pavo_last',id);
  refreshTopBar();
  updateZoomText();
  draw();
}
function newProject(){
  if(currentProjectId)saveProjects();
  const id='proj_'+Date.now();
  const p=loadProjects();
  p[id]={nodes:[],edges:[],camX:0,camY:0,zoom:1};
  localStorage.setItem('pavo_projects',JSON.stringify(p));
  loadProject(id);
}
function delProject(id){
  if(!confirm('确定删除这个项目？'))return;
  const p=loadProjects();
  delete p[id];
  localStorage.setItem('pavo_projects',JSON.stringify(p));
  if(currentProjectId===id)newProject();
  else refreshTopBar();
}
function refreshTopBar(){
  const bar=document.getElementById('topBar');
  bar.innerHTML='';
  const p=loadProjects();
  Object.keys(p).forEach(id=>{
    const div=document.createElement('div');
    div.className='proj-item'+(id===currentProjectId?' active':'');
    const name=document.createElement('span');
    name.innerText=p[id].name||('项目 '+id.slice(-6));
    name.ondblclick=(ev)=>{
      ev.stopPropagation();
      const nn=prompt('重命名',p[id].name||'');
      if(nn!==null){
        p[id].name=nn;
        localStorage.setItem('pavo_projects',JSON.stringify(p));
        refreshTopBar();
      }
    }
    const del=document.createElement('span');
    del.className='del-proj';
    del.innerText=' ×';
    del.onclick=(e)=>{
      e.stopPropagation();
      e.preventDefault();
      delProject(id);
    };
    div.appendChild(name);div.appendChild(del);
    div.onclick=()=>loadProject(id);
    bar.appendChild(div);
  })
  const add=document.createElement('div');
  add.className='proj-item';
  add.innerText='+ 新建';
  add.onclick=newProject;
  bar.appendChild(add);
}

function addNode(){addNodeAt(getViewCenterPos());}
function addNodeAt(pos){
  const n={
    x:pos.x-80,y:pos.y-60,w:160,h:120,
    title:'新节点',type:'text',isVideo:false,_objectUrl:null,
    videoEl:null,videoSnap:null,videoPlaying:false,text:''
  };
  nodes.push(n);
  setSelection([n]);
  saveProjects();
  draw();
  return n;
}
function delSel(){
  const sel=[...selectedNodes];
  if(!sel.length){toast('没有选中节点');return;}
  sel.forEach(n=>{
    destroyVideo(n);
    const i=nodes.indexOf(n);
    if(i>-1)nodes.splice(i,1);
  });
  edges=edges.filter(e=>!sel.includes(e.a)&&!sel.includes(e.b));
  if(selectedEdge&&!edges.includes(selectedEdge))selectedEdge=null;
  if(portDrag&&sel.includes(portDrag.node))portDrag=null;
  if(connectPendingNode&&sel.includes(connectPendingNode))connectPendingNode=null;
  setSelection([]);
  saveProjects();
  draw();
  toast('已删除 '+sel.length+' 个节点');
}
function chainSelected(){
  if(!selected){alert("请先点击选中第一个节点！");return;}
  if(!connectPendingNode){
    connectPendingNode=selected;
    alert("✅ 已选定起点，现在点击第二个节点，完成连线");
  }else{
    if(connectPendingNode===selected){
      alert("不能自己连自己！");
      connectPendingNode=null;
      return;
    }
    edges.push({a:connectPendingNode,b:selected});
    connectPendingNode=null;
    saveProjects();
    draw();
  }
}
function connectFrom(n){
  connectPendingNode=n;
  setSelection([n]);
  toast('已设为起点，右键目标节点完成连线');
  draw();
}
function connectTo(n){
  if(!connectPendingNode||connectPendingNode===n)return;
  edges.push({a:connectPendingNode,b:n});
  connectPendingNode=null;
  saveProjects();
  draw();
  toast('连线完成');
}
function disconnectNode(n){
  const before=edges.length;
  edges=edges.filter(e=>e.a!==n&&e.b!==n);
  saveProjects();draw();
  toast('已断开 '+(before-edges.length)+' 条连线');
}
function bringToFront(){
  [...selectedNodes].forEach(n=>{
    const i=nodes.indexOf(n);
    if(i>-1){nodes.splice(i,1);nodes.push(n);}
  });
  saveProjects();draw();
}
function sendToBack(){
  [...selectedNodes].reverse().forEach(n=>{
    const i=nodes.indexOf(n);
    if(i>-1){nodes.splice(i,1);nodes.unshift(n);}
  });
  saveProjects();draw();
}

function pasteClipboard(offset){

function zoomAt(factor,sx,sy){
  const px=(sx===undefined?W/2:sx),py=(sy===undefined?H/2:sy);
  const wx=(px-camX)/zoom,wy=(py-camY)/zoom;
  zoom=Math.min(20,Math.max(0.01,zoom*factor));
  camX=px-wx*zoom;
  camY=py-wy*zoom;
  updateZoomText();
}
function zoomIn(){zoomAt(1.1)}
function zoomOut(){zoomAt(1/1.1)}
function fitView(){zoom=1;camX=0;camY=0;updateZoomText();draw()}
// 缩放到恰好框住全部节点（四周留边距），空画布则回原点
function fitContent(){
  if(!nodes.length){fitView();return;}
  let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;
  nodes.forEach(n=>{a=Math.min(a,n.x);b=Math.min(b,n.y);c=Math.max(c,n.x+n.w);d=Math.max(d,n.y+n.h);});
  const pad=80;a-=pad;b-=pad;c+=pad;d+=pad;
  zoom=Math.min(20,Math.max(0.01,Math.min(W/(c-a),H/(d-b))));
  camX=(W-(a+c)*zoom)/2;
  camY=(H-(b+d)*zoom)/2;
  updateZoomText();
  draw();
  toast('已定位到全部内容');
}

async function runAI(){
  const typeEl=document.getElementById('aiType');
  const t=typeEl?typeEl.value:'video';
  const prompt=document.getElementById('aiPrompt').value.trim();
  if(!prompt)return alert('请填写提示词');
  if(t==="text"){
    const center=getViewCenterPos();
    const nText={
      x:center.x-110,y:center.y-70,w:220,h:140,
      title:'分镜文本',type:'text',isVideo:false,
      text:prompt
    };
    nodes.push(nText);
    setSelection([nText]);
    saveProjects();
    draw();
    alert('✅ 文本脚本节点已创建！');
    closeAIModal();
    return;
  }
  if(t==="image"){
    const ratio=document.getElementById('aiRatio').value;
    const k=document.getElementById('aiK').value;
    const seed=parseInt(document.getElementById('aiSeed').value,10);
    const longSide={'1':1024,'2':2048,'4':4096}[k]||1024;
    let size;
    if(ratio==='9:16')size=longSide/2+'x'+longSide;
    else if(ratio==='1:1')size=longSide+'x'+longSide;
    else size=longSide+'x'+(longSide/2);
    const payload={model:'agnes-image-2.5-flash',prompt:prompt,size:size};
    if(!isNaN(seed)&&seed>=0)payload.seed=seed;
    if(refImageBlob)payload.image=await blobToBase64(refImageBlob);
    const ctl=beginWait('图片生成中');
    if(!ctl){toast('已有任务在生成中，请等它完成或先取消');return;}
    closeAIModal();
    try{
      const res=await fetch(API_BASE+'/images/generations',{
        method:'POST',
        headers:{'Authorization':'Bearer '+API_KEY,'Content-Type':'application/json'},
        body:JSON.stringify(payload)
      });
      const data=await res.json();
      if(!waitCtl||waitCtl.cancelled){refImageBlob=null;return;}
      if(!res.ok||!(data.data&&data.data[0]&&data.data[0].url)){
        endWait();
        alert('图片生成失败：'+JSON.stringify(data).slice(0,300));
        refImageBlob=null;
        return;
      }
      const url=data.data[0].url;
      const c=getViewCenterPos();
      const ar=ratio==='9:16'?0.5625:(ratio==='1:1'?1:1.7778);
      const n={
        x:c.x-90,y:c.y-70,w:180,h:Math.round(180/ar),
        title:'AI生成图片',type:'img',isVideo:false,src:url
      };
      nodes.push(n);
      setSelection([n]);
      saveProjects();
      draw();
      endWait();
      toast('✅ 图片已生成，加入画布');
    }catch(e){
      if(waitCtl)endWait();
      alert('网络请求失败：'+e.message+'\n请检查网络后重试');
    }
    refImageBlob=null;
    return;
  }
  const dur=document.getElementById("aiDuration").value;
  const ratio=document.getElementById("aiRatio").value;
  let videoMode="text";
  let refImageB64=null;
  let refVideoB64=null;
  if(refVideoBlob){
    videoMode="reference";
    refVideoB64=await blobToBase64(refVideoBlob);
  }else if(refImageBlob){
    videoMode="keyframe";
    refImageB64=await blobToBase64(refImageBlob);
  }
  const payload={
    model:"agnes-video-2.5-flash",
    prompt:prompt,
    mode:videoMode,
    seconds:String(dur),
    size:"720P",
    aspect_ratio:ratio
  };
  if(videoMode==="keyframe")payload.image=refImageB64;
  if(videoMode==="reference")payload.video=refVideoB64;
  const ctl=beginWait('视频生成排队中');
  if(!ctl){toast('已有任务在排队，请等它完成或先取消');return;}
  const RETRY_WAIT=20000;
  const pollBase=API_BASE.replace('/v1','');
  // 参考素材已转成 base64 写进 payload，原引用可释放
  refImageBlob=null;refVideoBlob=null;

  function later(fn,ms){
    if(!waitCtl||waitCtl.cancelled)return;
    setTimeout(()=>{if(waitCtl&&!waitCtl.cancelled)fn();},ms);
  }
  async function submitTask(){
    if(!waitCtl||waitCtl.cancelled)return;
    let res=null,data=null,nerr=null;
    try{
      res=await fetch(API_BASE+"/videos",{
        method:"POST",
        headers:{"Authorization":"Bearer "+API_KEY,"Content-Type":"application/json"},
        body:JSON.stringify(payload)
      });
      data=await res.json();
    }catch(e){nerr=e;}
    if(!waitCtl||waitCtl.cancelled)return;
    if(res&&res.ok&&data&&data.video_id){poll(data.video_id);return;}
    waitCtl.tries++;
    waitSubTick();
    if(nerr){waitMsg('网络异常，持续重试中…');}
    else if(data&&data.code==='video_queue_full'){waitMsg('使用的人太多，队列已满，排队重试中…');}
    else{waitMsg('暂未提交成功：'+JSON.stringify(data||{}).slice(0,90)+'，持续重试…');}
    later(submitTask,RETRY_WAIT);
  }
  async function poll(vid){
    if(!waitCtl||waitCtl.cancelled)return;
    let pr=null,pd=null,nerr=null;
    try{
      pr=await fetch(pollBase+"/agnesapi?video_id="+vid+"&model_name=agnes-video-2.5-flash",{
        headers:{"Authorization":"Bearer "+API_KEY}
      });
      pd=await pr.json();
    }catch(e){nerr=e;}
    if(!waitCtl||waitCtl.cancelled)return;
    if(nerr||(pr&&!pr.ok)){
      waitCtl.tries++;
      waitMsg('查询进度异常，继续等待…');
      later(()=>poll(vid),3000);
      return;
    }
    if(pd.status==="completed"){
      const c=getViewCenterPos();
      const n={
        x:c.x-90,y:c.y-70,w:180,h:140,
        title:"AI生成视频",type:"video",isVideo:true,
        _objectUrl:pd.url,videoEl:null,videoSnap:null,videoPlaying:false,src:pd.url
      };
      const v=document.createElement('video');
      v.src=pd.url;
      attachVideo(n,v);
      nodes.push(n);setSelection([n]);
      saveProjects();
      draw();
      endWait();
      toast('✅ 视频生成完成，已加入画布');
    }else if(pd.status==="failed"){
      waitCtl.tries++;
      waitMsg('本轮生成失败：'+((pd.error&&pd.error.message)||'未知错误')+'，重新排队…');
      later(submitTask,RETRY_WAIT);
    }else{
      waitMsg('排队/生成中，请耐心等待…');
      later(()=>poll(vid),1500);
    }
  }
  submitTask();
  closeAIModal();
}

// ---- 生成排队等待遮罩：无限重试直到出片 ----
let waitCtl=null;
function fmtMs(ms){
  const s=Math.floor(ms/1000);
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}
function beginWait(title){
  if(waitCtl&&!waitCtl.cancelled)return null;
  const ctl={cancelled:false,t0:Date.now(),tries:0,timer:null};
  waitCtl=ctl;
  const mask=document.getElementById('waitMask');
  mask.querySelector('.wait-title').innerText=title;
  mask.querySelector('.wait-msg').innerText='正在提交任务…';
  mask.classList.add('show');
  ctl.timer=setInterval(()=>{
    document.getElementById('waitSub').innerText='已等待 '+fmtMs(Date.now()-ctl.t0)+' · 重试 '+ctl.tries+' 次';
  },1000);
  return ctl;
}
function waitSubTick(){
  if(!waitCtl)return;
  document.getElementById('waitSub').innerText='已等待 '+fmtMs(Date.now()-waitCtl.t0)+' · 重试 '+waitCtl.tries+' 次';
}
function waitMsg(msg){
  const el=document.getElementById('waitMsg');
  if(el)el.innerText=msg;
}
function endWait(){
  if(waitCtl&&waitCtl.timer)clearInterval(waitCtl.timer);
  waitCtl=null;
  document.getElementById('waitMask').classList.remove('show');
}
// 有任务在生成时，关闭或刷新页面会先弹浏览器确认框，防误关丢任务
window.addEventListener('beforeunload',e=>{
  if(waitCtl&&!waitCtl.cancelled){
    e.preventDefault();
    e.returnValue='还有任务正在生成，确定要离开吗？';
  }
});
function cancelWait(){
  if(!waitCtl)return;
  waitCtl.cancelled=true;
  endWait();
  refImageBlob=null;refVideoBlob=null;
  toast('已取消排队任务');
}

// 连线端点：固定吸附到卡片左右两侧的端口圆点
function edgeAnchors(e){
  const A=e.a,B=e.b;
  const acx=A.x+A.w/2,bcx=B.x+B.w/2;
  const acy=A.y+A.h/2,bcy=B.y+B.h/2;
  const right=bcx>=acx;
  return {
    a:{x:right?A.x+A.w:A.x,y:acy},
    b:{x:right?B.x:B.x+B.w,y:bcy}
  };
}
// 三次贝塞尔控制点：从左右端口水平出入，正对时自动形成 S 弯
function edgeCurve(a,b){
  const dx=b.x-a.x;
  const dist=Math.hypot(dx,b.y-a.y)||1;
  const k=Math.min(180,Math.max(45,dist*0.45));
  const sx=Math.abs(dx)<1?1:Math.sign(dx);
  return {
    c1:{x:a.x+sx*k,y:a.y},
    c2:{x:b.x-sx*k,y:b.y}
  };
}
// 卡片左右两侧的小圆点：连线的引出接口
function drawPorts(n){
  const R=5,col='#7c3aed';
  [{x:n.x,y:n.y+n.h/2},{x:n.x+n.w,y:n.y+n.h/2}].forEach(p=>{
    const hot=portDrag&&portDrag.node===n&&Math.hypot(p.x-portDrag.pos.x,p.y-portDrag.pos.y)<2;
    ctx.beginPath();
    ctx.arc(p.x,p.y,hot?R+2.5:R,0,Math.PI*2);
    ctx.fillStyle=hot?'#a78bfa':col;
    ctx.fill();
    ctx.lineWidth=1.5/zoom;
    ctx.strokeStyle='#0a0b10';
    ctx.stroke();
  });
}
// 弯曲虚线，带流动动画（在相机变换下按世界坐标绘制）
function drawEdge(a,b,o){
  o=o||{};
  const c=edgeCurve(a,b);
  ctx.save();
  ctx.globalAlpha=o.alpha==null?1:o.alpha;
  ctx.strokeStyle=o.color||'#7c3aed';
  ctx.lineWidth=(o.width||2)/zoom;
  ctx.lineCap='round';
  ctx.setLineDash([7/zoom,6/zoom]);
  ctx.lineDashOffset=(o.flow||0)/zoom;
  ctx.beginPath();
  ctx.moveTo(a.x,a.y);
  ctx.bezierCurveTo(c.c1.x,c.c1.y,c.c2.x,c.c2.y,b.x,b.y);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

// 卡片尺寸按素材宽高比自适应（面积大致恒定，以卡片中心为锚点）
function fitNodeByAspect(n,mw,mh){
  if(!mw||!mh)return;
  const ar=mw/mh;
  const A=180*140;
  const cx=n.x+n.w/2,cy=n.y+n.h/2;
  n.w=Math.max(90,Math.min(460,Math.round(Math.sqrt(A*ar))));
  n.h=Math.round(A/n.w);
  n.x=Math.round(cx-n.w/2);n.y=Math.round(cy-n.h/2);
  scheduleSave();
}
// 素材按 cover 方式铺满整张卡片：等比放大到盖住卡片，多余部分裁掉
function drawCover(el,n){
  const iw=el.videoWidth||el.naturalWidth||el.width;
  const ih=el.videoHeight||el.naturalHeight||el.height;
  if(!iw||!ih)return;
  const s=Math.max(n.w/iw,n.h/ih);
  try{ctx.drawImage(el,n.x+(n.w-iw*s)/2,n.y+(n.h-ih*s)/2,iw*s,ih*s);}catch(e){}
}
// 创建视频元素并挂上元数据回调，让卡片跟随视频真实宽高比
function attachVideo(n,v){
  v.muted=true;v.preload='metadata';
  v.addEventListener('loadedmetadata',()=>{
    if(v.videoWidth)fitNodeByAspect(n,v.videoWidth,v.videoHeight);
  });
  n.videoEl=v;
}
// 端口命中：世界坐标下找半径内最近的圆点
function portAt(m){
  const r=(isTouchDevice?16:9)/zoom;
  let best=null,bd=r;
  for(let i=nodes.length-1;i>=0;i--){
    const n=nodes[i];
    const pts=[{x:n.x,y:n.y+n.h/2},{x:n.x+n.w,y:n.y+n.h/2}];
    for(const p of pts){
      const d=Math.hypot(m.x-p.x,m.y-p.y);
      if(d<=bd){bd=d;best={node:n,pos:p};}
    }
  }
  return best;
}
function bezPoint(a,c1,c2,b,t){
  const u=1-t;
  return {
    x:u*u*u*a.x+3*u*u*t*c1.x+3*u*t*t*c2.x+t*t*t*b.x,
    y:u*u*u*a.y+3*u*u*t*c1.y+3*u*t*t*c2.y+t*t*t*b.y
  };
}
// 连线命中：沿贝塞尔曲线采样，判断点是否落在线上
function edgeNearPoint(m){
  const r=(isTouchDevice?12:6)/zoom;
  for(const e of edges){
    if(!e.a||!e.b)continue;
    const ap=edgeAnchors(e),c=edgeCurve(ap.a,ap.b);
    for(let t=0;t<=1.0001;t+=0.04){
      const p=bezPoint(ap.a,c.c1,c.c2,ap.b,t);
      if(Math.hypot(p.x-m.x,p.y-m.y)<=r)return e;
    }
  }
  return null;
}
function deleteEdge(e){
  edges=edges.filter(x=>x!==e);
  if(selectedEdge===e)selectedEdge=null;
  saveProjects();draw();
  toast('连线已删除');
}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#0a0b10';
  ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(camX,camY);
  ctx.scale(zoom,zoom);
  ctx.strokeStyle='#22283b';
  ctx.lineWidth=1/zoom;
  let gs=40;
  const sz=gs*zoom;
  if(sz<18){while(gs*zoom<18)gs*=5;}
  else if(sz>90){while(gs*zoom>90)gs/=5;}
  const vl=-camX/zoom, vt=-camY/zoom;
  const vr=(W-camX)/zoom, vb=(H-camY)/zoom;
  const x0=Math.floor(vl/gs)*gs, x1=Math.ceil(vr/gs)*gs;
  const y0=Math.floor(vt/gs)*gs, y1=Math.ceil(vb/gs)*gs;
  ctx.beginPath();
  for(let x=x0;x<=x1;x+=gs){ctx.moveTo(x,vt);ctx.lineTo(x,vb);}
  for(let y=y0;y<=y1;y+=gs){ctx.moveTo(vl,y);ctx.lineTo(vr,y);}
  ctx.stroke();
  const edgeFlow=(performance.now()/45)%13;
  edges.forEach(e=>{
    if(!e.a||!e.b)return;
    const ap=edgeAnchors(e);
    if(e===selectedEdge)drawEdge(ap.a,ap.b,{flow:-edgeFlow,color:'#f87171',width:3.5});
    else drawEdge(ap.a,ap.b,{flow:-edgeFlow});
  })
  nodes.forEach(n=>{
    ctx.fillStyle='#1c2030';
    roundRect(n.x,n.y,n.w,n.h,10);
    ctx.fill();
    const isSel=selectedNodes.has(n);
    let mediaEl=null;
    if(n.type==='img'&&n.src){
      if(!imgCache[n.src]){
        imgCache[n.src]=new Image();
        imgCache[n.src].src=n.src;
      }
      const im=imgCache[n.src];
      if(im.complete&&im.naturalWidth>0){
        if(!n._fitted){fitNodeByAspect(n,im.naturalWidth,im.naturalHeight);n._fitted=true;}
        mediaEl=im;
      }
    }else if(n.isVideo&&n.videoSnap){
      mediaEl=n.videoSnap;
    }
    if(mediaEl){
      ctx.save();
      roundRect(n.x,n.y,n.w,n.h,10);
      ctx.clip();
      drawCover(mediaEl,n);
      ctx.restore();
    }
    if(n.type==='text'&&n.text){
      ctx.fillStyle="#cdd5e1";
      ctx.font="12px system-ui";
      const t=n.text.slice(0,60)+(n.text.length>60?"...":"");
      ctx.fillText(t,n.x+10,n.y+44);
    }
    ctx.font='12px system-ui';
    const tw=ctx.measureText(n.title).width;
    ctx.fillStyle='rgba(10,11,16,.62)';
    roundRect(n.x+6,n.y+6,Math.min(tw+14,n.w-12),20,6);
    ctx.fill();
    ctx.fillStyle='#fff';
    ctx.fillText(n.title,n.x+13,n.y+20);
    ctx.strokeStyle=isSel?'#7c3aed':'#444b66';
    if(connectPendingNode===n)ctx.strokeStyle='#22c55e';
    ctx.lineWidth=(isSel?(lastSelected===n?3:2):2)/zoom;
    roundRect(n.x,n.y,n.w,n.h,10);
    ctx.stroke();
    if(marquee&&marquee.active&&marquee.hits&&marquee.hits.indexOf(n)>-1){
      ctx.strokeStyle='#a78bfa';
      ctx.lineWidth=2/zoom;
      ctx.setLineDash([6/zoom,4/zoom]);
      roundRect(n.x-4,n.y-4,n.w+8,n.h+8,12);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  })
  nodes.forEach(n=>drawPorts(n));
  if(portDrag){
    const tgt=hitNode({x:portDrag.mx,y:portDrag.my});
    const b=(tgt&&tgt!==portDrag.node)?edgeAnchors({a:portDrag.node,b:tgt}).b:{x:portDrag.mx,y:portDrag.my};
    if(tgt&&tgt!==portDrag.node){
      ctx.save();
      roundRect(tgt.x-3,tgt.y-3,tgt.w+6,tgt.h+6,12);
      ctx.strokeStyle='#22c55e';
      ctx.lineWidth=2.5/zoom;
      ctx.stroke();
      ctx.restore();
    }
    drawEdge(portDrag.pos,b,{alpha:.85,color:'#a78bfa'});
    ctx.save();
    ctx.beginPath();ctx.arc(b.x,b.y,5,0,Math.PI*2);
    ctx.fillStyle='#a78bfa';ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  if(marquee&&marquee.active){
    const x=Math.min(marquee.x0,marquee.x1);
    const y=Math.min(marquee.y0,marquee.y1);
    const w=Math.abs(marquee.x1-marquee.x0);
    const h=Math.abs(marquee.y1-marquee.y0);
    ctx.save();
    ctx.fillStyle='rgba(124,58,237,0.14)';
    ctx.fillRect(x,y,w,h);
    ctx.strokeStyle='#8b5cf6';
    ctx.lineWidth=1;
    ctx.setLineDash([5,4]);
    ctx.strokeRect(x+0.5,y+0.5,w,h);
    ctx.setLineDash([]);
    ctx.restore();
  }

  drawMinimap();

  if(connectPendingNode){
    ctx.save();
    ctx.fillStyle='rgba(34,197,94,.95)';
    ctx.font='13px system-ui';
    ctx.fillText('连线模式：已选起点「'+connectPendingNode.title+'」，点击或右键另一个节点完成连线（Esc 取消）',14,72);
    ctx.restore();
  }
}
// ---- 迷你导航图（左下角）----
function navRect(){
  let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;
  nodes.forEach(n=>{a=Math.min(a,n.x);b=Math.min(b,n.y);c=Math.max(c,n.x+n.w);d=Math.max(d,n.y+n.h);});
  if(!isFinite(a)){a=-400;b=-300;c=400;d=300;}
  const w=c-a||1,h=d-b||1;
  const m=Math.min(w,h)*0.12||60;
  a-=m;b-=m;c+=m;d+=m;
  const vl=-camX/zoom,vt=-camY/zoom,vr=(W-camX)/zoom,vb=(H-camY)/zoom;
  a=Math.min(a,vl);b=Math.min(b,vt);c=Math.max(c,vr);d=Math.max(d,vb);
  return {x0:a,y0:b,x1:c,y1:d};
}
function navDisp(){
  const nb=navRect();
  const maxW=180,maxH=124,pad=12;
  const s=Math.min(maxW/(nb.x1-nb.x0),maxH/(nb.y1-nb.y0));
  const w=(nb.x1-nb.x0)*s,h=(nb.y1-nb.y0)*s;
  const left=pad,top=H-pad-h-6;
  return {left,top,w,h,nb};
}
function drawMinimap(){
  const nd=navDisp(),nb=nd.nb;
  ctx.save();
  ctx.fillStyle='rgba(20,22,31,.88)';
  ctx.strokeStyle='#2d3348';
  ctx.lineWidth=1;
  roundRect(nd.left-6,nd.top-6,nd.w+12,nd.h+12,8);
  ctx.fill();ctx.stroke();
  const sx=v=>nd.left+(v-nb.x0)/(nb.x1-nb.x0)*nd.w;
  const sy=v=>nd.top+(v-nb.y0)/(nb.y1-nb.y0)*nd.h;
  ctx.fillStyle='#444b66';
  nodes.forEach(n=>{
    ctx.fillRect(sx(n.x),sy(n.y),
      Math.max(2,sx(n.x+n.w)-sx(n.x)),
      Math.max(2,sy(n.y+n.h)-sy(n.y)));
  });
  ctx.strokeStyle='#7c3aed';
  ctx.lineWidth=1.5;
  ctx.strokeRect(sx(-camX/zoom),sy(-camY/zoom),
    (W/zoom)/(nb.x1-nb.x0)*nd.w,(H/zoom)/(nb.y1-nb.y0)*nd.h);
  ctx.restore();
}
function navHit(px,py){
  const nd=navDisp();
  return px>=nd.left-6&&px<=nd.left+nd.w+6&&py>=nd.top-6&&py<=nd.top+nd.h+6;
}
function navSetView(px,py){
  const nd=navDisp(),nb=nd.nb;
  const wx=nb.x0+(px-nd.left)/nd.w*(nb.x1-nb.x0);
  const wy=nb.y0+(py-nd.top)/nd.h*(nb.y1-nb.y0);
  camX=W/2-wx*zoom;
  camY=H/2-wy*zoom;
}
function startLoop(){
  if(rafId)return;
  const loop=()=>{draw();rafId=requestAnimationFrame(loop);};
  rafId=requestAnimationFrame(loop);
}

cv.addEventListener('contextmenu',e=>{
  e.preventDefault();
  const m=world(e.offsetX,e.offsetY);
  const hit=hitNode(m);
  const ce=hit?null:edgeNearPoint(m);
  if(hit&&!selectedNodes.has(hit))setSelection([hit]);
  ctxTarget={type:hit?'node':(ce?'edge':'canvas'),node:hit,edge:ce,worldPos:m};
  openCtxMenu(e.clientX,e.clientY);
  draw();
});

cv.addEventListener('mousedown',e=>{
  closeCtxMenu();
  const sp={x:e.offsetX,y:e.offsetY};
  const m=world(sp.x,sp.y);
  if(e.button===1||(e.button===0&&spaceDown)){
    e.preventDefault();
    panStart={mouseX:sp.x,mouseY:sp.y,oldCamX:camX,oldCamY:camY};
    cv.style.cursor='grabbing';
    return;
  }
  if(e.button!==0)return;
  if(navHit(sp.x,sp.y)){
    navDown=true;
    navSetView(sp.x,sp.y);
    draw();
    return;
  }
  const port=portAt(m);
  if(port){
    portDrag={node:port.node,pos:port.pos,mx:m.x,my:m.y};
    draw();
    return;
  }
  const hit=hitNode(m);
  if(hit){
    if(e.shiftKey&&selectedNodes.has(hit)){
      selectedNodes.delete(hit);
      const rest=[...selectedNodes];
      lastSelected=rest.length?rest[rest.length-1]:null;
      selected=lastSelected;
      draw();
      return;
    }
    if(!selectedNodes.has(hit))setSelection([hit],e.shiftKey);
    else{lastSelected=hit;selected=hit;}
    dragN=hit;
    dragNodes=[...selectedNodes].map(n=>({n,ox:n.x,oy:n.y}));
    pressInfo={x:sp.x,y:sp.y,world:m,moved:false};
    cv.style.cursor='move';
    draw();
    return;
  }
  marquee={x0:sp.x,y0:sp.y,x1:sp.x,y1:sp.y,additive:e.shiftKey,active:false,hits:[]};
  if(!e.shiftKey)setSelection([]);
  pressInfo={x:sp.x,y:sp.y,world:m,moved:false};
  draw();
});

cv.addEventListener('mousemove',e=>{
  const sp={x:e.offsetX,y:e.offsetY};
  const m=world(sp.x,sp.y);
  if(navDown){navSetView(sp.x,sp.y);return;}
  if(portDrag){portDrag.mx=m.x;portDrag.my=m.y;return;}
  if(dragNodes&&pressInfo){
    if(!pressInfo.moved&&Math.hypot(sp.x-pressInfo.x,sp.y-pressInfo.y)>3)pressInfo.moved=true;
    if(pressInfo.moved){
      const dx=m.x-pressInfo.world.x,dy=m.y-pressInfo.world.y;
      dragNodes.forEach(d=>{d.n.x=d.ox+dx;d.n.y=d.oy+dy;});
      scheduleSave();
    }
    return;
  }
  if(panStart){
    camX=panStart.oldCamX+(sp.x-panStart.mouseX);
    camY=panStart.oldCamY+(sp.y-panStart.mouseY);
    return;
  }
  if(marquee){
    marquee.x1=sp.x;
    marquee.y1=sp.y;
    if(!marquee.active&&Math.hypot(sp.x-marquee.x0,sp.y-marquee.y0)>3)marquee.active=true;
    if(marquee.active){
      const a=world(Math.min(marquee.x0,marquee.x1),Math.min(marquee.y0,marquee.y1));
      const b=world(Math.max(marquee.x0,marquee.x1),Math.max(marquee.y0,marquee.y1));
      const box={x:a.x,y:a.y,w:b.x-a.x,h:b.y-a.y};
      marquee.hits=nodes.filter(n=>rectsIntersect(n,box));
    }
    return;
  }
  if(navHit(sp.x,sp.y)){cv.style.cursor='pointer';return;}
  cv.style.cursor=portAt(m)?'grab':'crosshair';
});

window.addEventListener('mouseup',e=>{
  if(navDown){
    navDown=false;
    saveProjects();
    return;
  }
  if(portDrag){
    const rect=cv.getBoundingClientRect();
    const m=world(e.clientX-rect.left,e.clientY-rect.top);
    const tgt=hitNode(m);
    const from=portDrag.node;
    portDrag=null;
    if(tgt&&tgt!==from){
      const dup=edges.some(ed=>(ed.a===from&&ed.b===tgt)||(ed.a===tgt&&ed.b===from));
      if(dup)toast('这两个节点之间已有连线');
      else{edges.push({a:from,b:tgt});saveProjects();toast('连线完成');}
    }
    draw();
    return;
  }
  if(dragNodes){
    if(pressInfo&&pressInfo.moved)saveProjects();
    dragNodes=null;dragN=null;pressInfo=null;
    cv.style.cursor=spaceDown?'grab':'crosshair';
    return;
  }
  if(panStart){
    panStart=null;
    cv.style.cursor=spaceDown?'grab':'crosshair';
    return;
  }
  if(marquee){
    const mq=marquee;
    marquee=null;
    if(mq.active){
      const a=world(Math.min(mq.x0,mq.x1),Math.min(mq.y0,mq.y1));
      const b=world(Math.max(mq.x0,mq.x1),Math.max(mq.y0,mq.y1));
      const box={x:a.x,y:a.y,w:b.x-a.x,h:b.y-a.y};
      const hits=nodes.filter(n=>rectsIntersect(n,box));
      if(hits.length)setSelection(hits,mq.additive);
      else if(!mq.additive)setSelection([]);
      if(hits.length)toast('框选了 '+selectedNodes.size+' 个节点');
    }else if(!mq.additive){
      const mqm=world(mq.x0,mq.y0);
      const ce=edgeNearPoint(mqm);
      if(ce){selectedEdge=ce;selectedNodes.clear();selected=null;lastSelected=null;toast('已选中连线，按 Delete 键或右键可删除');}
      else{selectedEdge=null;setSelection([]);}
    }
    pressInfo=null;
    draw();
  }
});

cv.addEventListener('dblclick',e=>{

cv.addEventListener('wheel',e=>{

// ---- 移动端触控支持 ----
let ts=null;
let tsLongTimer=null;
let lastTapTime=0,lastTapX=0,lastTapY=0;
function tSp(e){
  const r=cv.getBoundingClientRect();
  const t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0]);
  return {x:t.clientX-r.left,y:t.clientY-r.top,cx:t.clientX,cy:t.clientY};
}
function tsCancel(){
  clearTimeout(tsLongTimer);
  if(!ts)return;
  if(ts.mode==='drag'){dragNodes=null;dragN=null;pressInfo=null;}
  if(ts.mode==='port')portDrag=null;
  if(ts.mode==='pan')panStart=null;
  ts=null;
}
function ctxAtPoint(sp,cx,cy){
  const m=world(sp.x,sp.y);
  const hit=hitNode(m);
  const ce=hit?null:edgeNearPoint(m);
  if(hit&&!selectedNodes.has(hit))setSelection([hit]);
  ctxTarget={type:hit?'node':(ce?'edge':'canvas'),node:hit,edge:ce,worldPos:m};
  openCtxMenu(cx,cy);
  if(navigator.vibrate)navigator.vibrate(15);
}
cv.addEventListener('touchstart',e=>{
  e.preventDefault();
  closeCtxMenu();
  clearTimeout(tsLongTimer);
  if(e.touches.length===2){
    tsCancel();
    const r=cv.getBoundingClientRect();
    const a=e.touches[0],b=e.touches[1];
    const p0={x:a.clientX-r.left,y:a.clientY-r.top};
    const p1={x:b.clientX-r.left,y:b.clientY-r.top};
    const mid={x:(p0.x+p1.x)/2,y:(p0.y+p1.y)/2};
    ts={mode:'pinch',d0:Math.max(10,Math.hypot(p1.x-p0.x,p1.y-p0.y)),zoom0:zoom,
        wmid:{x:(mid.x-camX)/zoom,y:(mid.y-camY)/zoom},moved:true};
    return;
  }
  if(e.touches.length>2){tsCancel();return;}
  const sp=tSp(e);
  const m=world(sp.x,sp.y);
  ts={mode:'',x0:sp.x,y0:sp.y,moved:false,longFired:false};
  if(navHit(sp.x,sp.y)){
    ts.mode='nav';
    navSetView(sp.x,sp.y);
    return;
  }
  const port=portAt(m);
  if(port){
    ts.mode='port';
    portDrag={node:port.node,pos:port.pos,mx:m.x,my:m.y};
    return;
  }
  const hit=hitNode(m);
  if(hit){
    ts.mode='drag';
    setSelection([hit]);
    dragN=hit;
    dragNodes=[...selectedNodes].map(n=>({n,ox:n.x,oy:n.y}));
    pressInfo={x:sp.x,y:sp.y,world:m,moved:false};
  }else{
    ts.mode='pan';
    panStart={mouseX:sp.x,mouseY:sp.y,oldCamX:camX,oldCamY:camY};
  }
  // 长按 0.52 秒：等效桌面右键
  tsLongTimer=setTimeout(()=>{
    if(ts&&!ts.moved&&!ts.longFired){
      ts.longFired=true;
      ctxAtPoint(sp,sp.cx,sp.cy);
    }
  },520);
},{passive:false});
cv.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(!ts)return;
  if(ts.mode==='pinch'){
    if(e.touches.length<2)return;
    const r=cv.getBoundingClientRect();
    const a=e.touches[0],b=e.touches[1];
    const p0={x:a.clientX-r.left,y:a.clientY-r.top};
    const p1={x:b.clientX-r.left,y:b.clientY-r.top};
    const mid={x:(p0.x+p1.x)/2,y:(p0.y+p1.y)/2};
    const d=Math.max(10,Math.hypot(p1.x-p0.x,p1.y-p0.y));
    zoom=Math.min(20,Math.max(0.01,ts.zoom0*(d/ts.d0)));
    camX=mid.x-ts.wmid.x*zoom;
    camY=mid.y-ts.wmid.y*zoom;
    updateZoomText();
    return;
  }
  const sp=tSp(e);
  if(!ts.moved&&Math.hypot(sp.x-ts.x0,sp.y-ts.y0)>8){
    ts.moved=true;
    clearTimeout(tsLongTimer);
  }
  if(!ts.moved)return;
  const m=world(sp.x,sp.y);
  if(ts.mode==='nav'){navSetView(sp.x,sp.y);return;}
  if(ts.mode==='port'){portDrag.mx=m.x;portDrag.my=m.y;return;}
  if(ts.mode==='drag'){
    if(pressInfo&&!pressInfo.moved)pressInfo.moved=true;
    if(pressInfo&&pressInfo.moved){
      const dx=m.x-pressInfo.world.x,dy=m.y-pressInfo.world.y;
      dragNodes.forEach(dd=>{dd.n.x=dd.ox+dx;dd.n.y=dd.oy+dy;});
      scheduleSave();
    }
    return;
  }
  if(ts.mode==='pan'&&panStart){
    camX=panStart.oldCamX+(sp.x-panStart.mouseX);
    camY=panStart.oldCamY+(sp.y-panStart.mouseY);
  }
},{passive:false});
function tsFinish(e){
  e.preventDefault();
  clearTimeout(tsLongTimer);
  if(!ts)return;
  // 捏合抬起一指：剩下手指转为平移，避免跳变
  if(e.touches.length>=1){
    if(ts.mode==='pinch'){
      const r=cv.getBoundingClientRect();
      const t0=e.touches[0];
      const p={x:t0.clientX-r.left,y:t0.clientY-r.top};
      ts={mode:'pan',x0:p.x,y0:p.y,moved:true,longFired:true};
      panStart={mouseX:p.x,mouseY:p.y,oldCamX:camX,oldCamY:camY};
    }
    return;
  }
  const sp=tSp(e);
  const m=world(sp.x,sp.y);
  if(ts.mode==='nav'){
    saveProjects();
  }else if(ts.mode==='port'){
    const tgt=hitNode(m);
    const from=portDrag?portDrag.node:null;
    portDrag=null;
    if(tgt&&from&&tgt!==from){
      const dup=edges.some(ed=>(ed.a===from&&ed.b===tgt)||(ed.a===tgt&&ed.b===from));
      if(dup)toast('这两个节点之间已有连线');
      else{edges.push({a:from,b:tgt});saveProjects();toast('连线完成');}
    }
  }else if(ts.mode==='drag'){
    if(pressInfo&&pressInfo.moved)saveProjects();
    else if(!ts.moved&&!ts.longFired)toast('已选中节点，长按打开操作菜单');
    dragNodes=null;dragN=null;pressInfo=null;
  }else if(ts.mode==='pan'){
    panStart=null;
    if(!ts.moved&&!ts.longFired){
      const now=Date.now();
      if(now-lastTapTime<350&&Math.hypot(sp.x-lastTapX,sp.y-lastTapY)<30){
        lastTapTime=0;
        addNodeAt(m);
      }else{
        lastTapTime=now;lastTapX=sp.x;lastTapY=sp.y;
        const ce=edgeNearPoint(m);
        if(ce){selectedEdge=ce;setSelection([]);toast('已选中连线，长按可删除');}
        else{selectedEdge=null;setSelection([]);}
      }
    }
  }
  ts=null;
  draw();
}
cv.addEventListener('touchend',tsFinish,{passive:false});
cv.addEventListener('touchcancel',tsCancel,{passive:false});

function isTypingTarget(t){
  return t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable);
}
window.addEventListener('keydown',e=>{
  if(e.code==='Space'&&!isTypingTarget(e.target)){
    if(!spaceDown){spaceDown=true;cv.style.cursor='grab';}
    e.preventDefault();
    return;
  }
  if(isTypingTarget(e.target))return;
  const k=e.key.toLowerCase();
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&k==='a'){e.preventDefault();selectAll();}
  else if(mod&&k==='c'){e.preventDefault();copySelection();}
  else if(mod&&k==='v'){e.preventDefault();pasteClipboard();}
  else if(mod&&k==='d'){e.preventDefault();duplicateSelection();}
  else if(e.key==='Delete'||e.key==='Backspace'){
    if(selectedEdge){e.preventDefault();deleteEdge(selectedEdge);}
    else if(selectedNodes.size){e.preventDefault();delSel();}
  }
  else if(e.key==='Escape'){
    closeCtxMenu();
    portDrag=null;
    if(connectPendingNode){connectPendingNode=null;toast('已取消连线起点');}
    else if(selectedEdge){selectedEdge=null;}
    else if(selectedNodes.size)setSelection([]);
    draw();
  }
});
window.addEventListener('keyup',e=>{
  if(e.code==='Space'){
    spaceDown=false;
    if(!panStart)cv.style.cursor='crosshair';
  }
});

function syncCanvasSize(){
  const vv=window.visualViewport;
  W=cv.width=Math.round(vv?vv.width:innerWidth);
  H=cv.height=Math.round(vv?vv.height:innerHeight);
}
addEventListener('resize',()=>{syncCanvasSize();draw();});
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',()=>{syncCanvasSize();draw();});
  window.visualViewport.addEventListener('scroll',()=>{syncCanvasSize();draw();});
}

(function init(){
  refreshTopBar();
  updateZoomText();
  const last=localStorage.getItem('pavo_last');
  const projs=loadProjects();
  if(last&&projs[last])loadProject(last);
  else newProject();
  startLoop();
})();
</script>
